<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <title>نظام إدارة المشتركين - النسخة الأمنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== MAIN LAYOUT ===== */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* ===== SIDE PANEL ===== */
        .side-panel {
            flex: 0 0 380px;
            max-width: 380px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .side-panel::-webkit-scrollbar {
            width: 4px;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .side-panel h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin: 15px 0 12px 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }

        /* ===== DROPDOWN (matching MD_Add) ===== */
        .modern-dropdown {
            position: relative;
            width: 100%;
        }

        .dropdown-btn {
            background: var(--primary);
            color: var(--white);
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            transition: all 0.3s ease;
            gap: 10px;
        }

        .dropdown-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
        }

        .dropdown-btn .arrow {
            font-size: 0.7rem;
            transition: transform 0.3s ease;
            opacity: 0.8;
        }

        .dropdown-btn .arrow.open {
            transform: rotate(180deg);
        }

        .dropdown-btn .icon-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 2000;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: dropdownFade 0.25s ease;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s ease;
            color: var(--primary);
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #f1f5f9;
            color: var(--accent);
            padding-right: 28px;
        }

        .dropdown-item .item-icon {
            font-size: 1.1rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .dropdown-item .item-label {
            flex: 1;
        }

        .dropdown-item .item-badge {
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* ===== MODE TAGS ===== */
        .mode-tag {
            display: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 6px 0 12px 0;
            text-align: center;
        }

        .customer-edit-mode {
            background: #dbeafe;
            color: #1e40af;
        }

        .meter-edit-mode {
            background: #d1fae5;
            color: #065f46;
        }

        /* ===== FORM ELEMENTS ===== */
        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            background: var(--white);
            transition: border 0.2s, box-shadow 0.2s;
            color: var(--text);
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-group input:disabled,
        .input-group textarea:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .row-flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .row-flex .input-group {
            flex: 1;
            min-width: 130px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        /* ===== BUTTONS ===== */
        .btn-excel {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-excel:hover {
            background: #15803d;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btns button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-save {
            background: var(--accent);
            color: white;
        }

        .btn-save:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-add-meter {
            background: var(--success);
            color: white;
        }

        .btn-add-meter:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .btn-update-all {
            background: var(--warning);
            color: white;
        }

        .btn-update-all:hover {
            background: #d97706;
            transform: translateY(-1px);
        }

        .btn-clear {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-clear:hover {
            background: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn-delete-db {
            background: var(--danger);
            color: white;
        }

        .btn-delete-db:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        #updateAllBtn {
            display: none;
        }

        #saveBtn {
            display: block;
        }

        #addMeterBtn {
            display: block;
        }

        /* ===== DISPLAY PANEL ===== */
        .display-panel {
            flex: 1;
            min-width: 0;
        }

        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--white);
            padding: 14px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border-top: 4px solid var(--accent);
        }

        .stat-card h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-card span {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .top-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: var(--white);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .top-bar h3 {
            font-size: 1rem;
            color: var(--primary);
            flex: 1;
            min-width: 120px;
            margin: 0;
        }

        .top-bar input {
            flex: 1;
            min-width: 150px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
        }

        .top-bar input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .top-bar button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .top-bar button:hover {
            background: var(--accent-hover);
        }

        /* ===== CARDS ===== */
        #cardsGrid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grouped-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .grouped-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        }

        .card-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            background: #fafcff;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header-main .customer-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
        }

        .merged-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 4px 16px;
            margin-top: 4px;
        }

        .merged-info-grid .info-item {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .delete-customer-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'Cairo', sans-serif;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .delete-customer-btn:hover {
            background: #b91c1c;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }

        .sub-records-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            min-width: 600px;
        }

        .sub-records-table th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            padding: 6px 4px;
            border-bottom: 2px solid var(--border);
            text-align: center;
            font-size: 0.65rem;
            white-space: nowrap;
        }

        .sub-records-table td {
            padding: 4px 4px;
            border-bottom: 1px solid #f1f5f9;
            text-align: center;
            cursor: pointer;
            vertical-align: middle;
            font-size: 0.7rem;
        }

        .sub-records-table tr:hover td {
            background: #f8fafc;
        }

        .sub-records-table .delete-btn {
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .sub-records-table .delete-btn:hover {
            color: #b91c1c;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .side-panel {
                flex: 1;
                max-width: 100%;
                position: static;
                max-height: none;
                padding: 16px 18px;
            }

            .side-panel h2 {
                font-size: 1rem;
            }

            .stats-dashboard {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 8px;
            }

            .side-panel {
                padding: 14px 16px;
            }

            .side-panel h2 {
                font-size: 0.9rem;
                margin: 10px 0 8px 0;
            }

            .row-flex {
                gap: 6px;
            }

            .row-flex .input-group {
                min-width: 100%;
            }

            .input-group input,
            .input-group textarea,
            .input-group select {
                font-size: 0.8rem;
                padding: 6px 10px;
            }

            .action-btns button {
                font-size: 0.8rem;
                padding: 8px 12px;
            }

            .stats-dashboard {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .stat-card {
                padding: 10px 8px;
            }

            .stat-card span {
                font-size: 1.1rem;
            }

            .top-bar {
                padding: 10px 12px;
                gap: 6px;
            }

            .top-bar h3 {
                font-size: 0.85rem;
                min-width: 80px;
            }

            .top-bar input {
                min-width: 100px;
                font-size: 0.8rem;
                padding: 6px 10px;
            }

            .top-bar button {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }

            .card-header-main {
                padding: 10px 12px;
            }

            .card-header-main .customer-title {
                font-size: 0.85rem;
            }

            .merged-info-grid {
                grid-template-columns: 1fr 1fr;
                gap: 2px 10px;
            }

            .merged-info-grid .info-item {
                font-size: 0.65rem;
            }

            .delete-customer-btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }

            .sub-records-table {
                font-size: 0.65rem;
                min-width: 480px;
            }

            .sub-records-table th {
                font-size: 0.55rem;
                padding: 4px 2px;
            }

            .sub-records-table td {
                font-size: 0.6rem;
                padding: 3px 2px;
            }

            /* Mobile dropdown - slides from bottom */
            .dropdown-menu {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: var(--radius) var(--radius) 0 0;
                max-height: 60vh;
                overflow-y: auto;
                animation: slideUp 0.3s ease;
            }

            @keyframes slideUp {
                from {
                    transform: translateY(100%);
                }

                to {
                    transform: translateY(0);
                }
            }

            .dropdown-item {
                padding: 14px 18px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .stats-dashboard {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card:last-child {
                grid-column: span 2;
            }

            .merged-info-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== SCROLLBAR STYLING ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- ===== SIDE PANEL ===== -->
        <div class="side-panel">

                            <option>هندسة مدينة شربين</option>
                            <option>هندسة قري شربين</option>
                            <option>هندسة دكرنس</option>
                            <option>هندسة جمصة</option>
                            <option>هندسة قري بلقاس</option>
                            <option>هندسة مدينة بلقاس</option>
                            <option>هندسة الستاموني</option>

                            <option>هندسة منية النصر</option>

                            <option>هندسة مدينة سيدي سالم</option>

            <!-- Variable Section (Meter Data) -->
            <div id="variableSection">
                <hr>
                <div class="input-group">
                    <label>رقم العداد (Key)</label>

                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>تاريخ الرفع</label>
                        <input type="date" id="inspection_date">
                    </div>
                    <div class="input-group">
                        <label>تاريخ التركيب</label>
                        <input type="date" id="fix_date">
                    </div>
                </div>
                <div class="input-group">
                    <label>تاريخ الإطلاق</label>
                    <input type="date" id="power_date">
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>kWh</label>
                        <input id="kwh_reading">
                    </div>
                    <div class="input-group">
                        <label>kVARh</label>
                        <input id="kvarh_reading">
                    </div>
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>VT Ratio</label>
                        <input id="vt_ratio">
                    </div>
                    <div class="input-group">
                        <label>CT Ratio</label>
                        <input id="ct_ratio">
                    </div>
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>الثابت</label>
                        <input id="constant">
                    </div>
                    <div class="input-group">
                        <label>المكان</label>
                        <input id="location">
                    </div>
                </div>
                <div class="input-group">
                    <label>نوع العداد</label>
                    <input id="mtype">
                </div>
                <div class="input-group">
                    <label>الملاحظات</label>
                    <textarea id="notes" rows="2"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-btns">
                <button id="saveBtn" class="btn-save" onclick="quickSave()">💾 حفظ/تحديث العداد</button>
                <button id="addMeterBtn" class="btn-add-meter" onclick="addNewMeter()">➕ حفظ عداد جديد</button>
                <button id="updateAllBtn" class="btn-update-all" onclick="updateCustomerData()">🔄 تحديث البيانات
                    العامة</button>
                <button class="btn-clear" onclick="clearForm()">🧹 تفريغ الحقول</button>
                <button class="btn-delete-db" onclick="protectedAction('deleteAll')">🗑️ مسح قاعدة البيانات
                    بالكامل</button>
            </div>
        </div>

        <!-- ===== DISPLAY PANEL ===== -->
        <div class="display-panel">
            <div class="stats-dashboard">
                <div class="stat-card">
                    <h4>إجمالي المشتركين</h4>
                    <span id="count-customers">0</span>
                </div>
                <div class="stat-card" style="border-top-color: var(--success);">
                    <h4>إجمالي العدادات</h4>
                    <span id="count-meters">0</span>
                </div>
                <div class="stat-card" style="border-top-color: var(--warning);">
                    <h4>آخر تحديث</h4>
                    <span id="last-update" style="font-size: 0.8rem;">--:--</span>
                </div>
            </div>

            <div class="top-bar">
                <h3>📋 سجل المشتركين</h3>
                <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو رقم العداد...">
                <button onclick="loadDataFromFirebase()">🔄</button>
            </div>

            <div id="cardsGrid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            databaseURL: "https://production1-ae85-default-rtdb.firebaseio.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528",
            measurementId: "G-W3TZ1EKWWN"
        };

        const app = initializeApp(firebaseConfig);
        const dbMD = getDatabase(app);
        const dbPass = getDatabase(app);

        try {
            getAnalytics(app);
        } catch (err) {
            console.warn("Analytics disabled:", err);
        }

        let allCustomers = {};
        const ADMIN_PASS = "1";

        // ===== DROPDOWN =====
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('dropdownBtn');
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('arrow');

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                menu.classList.toggle('show');
                arrow.classList.toggle('open');
            });

            const items = document.querySelectorAll('.dropdown-item');
            items.forEach(item => {
                item.addEventListener('click', function () {
                    const page = this.getAttribute('data-page');
                    if (page) {
                        window.location.href = page;
                    }
                });
            });

            window.addEventListener('click', function () {
                if (menu.classList.contains('show')) {
                    menu.classList.remove('show');
                    arrow.classList.remove('open');
                }
            });
        });

        // ===== PROTECTED ACTION =====
        window.protectedAction = async function (type) {
            const { value: password } = await Swal.fire({
                title: 'كلمة المرور مطلوبة',
                input: 'password',
                inputPlaceholder: 'أدخل كلمة المرور',
                showCancelButton: true
            });

            if (password === ADMIN_PASS) {
                if (type === 'upload') document.getElementById('excelFile').click();
                if (type === 'deleteAll') deleteAllData();
            } else if (password !== undefined) {
                Swal.fire("خطأ", "كلمة المرور غير صحيحة", "error");
            }
        };

        // ===== UTILITY FUNCTIONS =====
        function sanitizeKey(key) {
            if (!key) return "unknown";
            return String(key).replace(/[.#$\[\]\(\)\/\s]/g, "").trim();
        }

        function formatExcelDate(val) {
            if (!val) return "";
            if (!isNaN(val) && typeof val === 'number') {
                const date = new Date(Math.round((val - 25569) * 86400 * 1000));
                return date.toISOString().split('T')[0];
            }
            return String(val).trim();
        }

        function getVal(row, possibleNames) {
            const rowKeys = Object.keys(row);
            for (let target of possibleNames) {
                let cleanTarget = target.replace(/\s+/g, '').toLowerCase();
                for (let actualKey of rowKeys) {
                    let cleanActual = actualKey.replace(/\s+/g, '').toLowerCase();
                    if (cleanActual === cleanTarget || cleanActual.includes(cleanTarget)) return row[actualKey];
                }
            }
            return "";
        }

        // ===== EXCEL UPLOAD =====
        document.getElementById("excelFile").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                Swal.fire({
                    title: 'جاري المعالجة...', text: `تحليل ${json.length} سجل`, didOpen: () => Swal
                        .showLoading()
                });

                const grouped = {};
                json.forEach((row) => {
                    const rawName = String(getVal(row, ['الاسم', 'اسم المشترك'])).trim();
                    const rawMNo = String(getVal(row, ['رقم الشاسيه', 'رقم العداد'])).trim();
                    if (!rawName || rawName === "undefined" || !rawMNo || rawMNo === "undefined") return;

                    const safeNameKey = sanitizeKey(rawName);
                    const safeMKey = sanitizeKey(rawMNo);

                    if (!grouped[safeNameKey]) {
                        grouped[safeNameKey] = {
                            metername: rawName,
                            name: rawName,
                            keta3: getVal(row, ['القطاع']) || "-",
                            handsa: getVal(row, ['الهندسة', 'الهندسه']) || "-",
                            max_load: getVal(row, ['اقصى حمل', 'أقصى حمل']) || 0,
                            power_factor: getVal(row, ['معامل قدرة', 'معامل القدرة', 'pf']) || 0,
                            passing_date: formatExcelDate(getVal(row, ['تاريخ المرور', 'المرور'])),
                            meters: {}
                        };
                    }
                    grouped[safeNameKey].meters[safeMKey] = {
                        meternumber: rawMNo,
                        kwh_reading: getVal(row, ['القراءة ك.و.س', 'kwh']) || 0,
                        kvarh_reading: getVal(row, ['القراءة ك.فار .س', 'kvarh']) || 0,
                        vt_ratio: getVal(row, ['محولات الجهد']) || "11000/110",
                        ct_ratio: getVal(row, ['محولات التيار']) || "200/5",
                        constant: getVal(row, ['الثابت']) || 1,
                        location: getVal(row, ['مكان التركيب']) || "",
                        metertype: getVal(row, ['نوع العداد']) || "",
                        inspection_date: formatExcelDate(getVal(row, ['تاريخ الرفع'])),
                        fix_date: formatExcelDate(getVal(row, ['تاريخ التركيب'])),
                        power_date: formatExcelDate(getVal(row, ['تاريخ الأطلاق'])),
                        meternotes: getVal(row, ['ملاحظات']) || ""
                    };
                });

                try {
                    await Promise.all([
                        set(ref(dbPass, "MD_Pass/customers"), grouped),
                        set(ref(dbMD, "MD/customers"), grouped)
                    ]);
                    Swal.fire("نجاح", "تم التحديث بنجاح في القاعدتين", "success");
                    loadDataFromFirebase();
                } catch (err) {
                    Swal.fire("خطأ", err.message, "error");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ===== LOAD DATA =====
        window.loadDataFromFirebase = async function () {
            const grid = document.getElementById("cardsGrid");
            grid.innerHTML = "جاري جلب البيانات...";
            try {
                const [snapMD, snapPass] = await Promise.all([
                    get(ref(dbMD, "MD/customers")),
                    get(ref(dbPass, "MD_Pass/customers"))
                ]);

                const mdData = snapMD.exists() ? snapMD.val() : {};
                const passData = snapPass.exists() ? snapPass.val() : {};

                allCustomers = { ...passData, ...mdData };

                if (Object.keys(allCustomers).length > 0) {
                    updateStats();
                    renderCards();
                } else {
                    allCustomers = {};
                    grid.innerHTML = "لا توجد بيانات";
                    updateStats(true);
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = "خطأ في الاتصال";
            }
        };

        function updateStats(isEmpty = false) {
            if (isEmpty) {
                document.getElementById("count-customers").innerText = "0";
                document.getElementById("count-meters").innerText = "0";
                return;
            }
            const keys = Object.keys(allCustomers);
            let totalM = 0;
            keys.forEach(id => totalM += Object.keys(allCustomers[id].meters || {}).length);
            document.getElementById("count-customers").innerText = keys.length;
            document.getElementById("count-meters").innerText = totalM;
            document.getElementById("last-update").innerText = new Date().toLocaleTimeString('ar-EG');
        }

        // ===== DELETE ALL =====
        window.deleteAllData = async function () {
            const result = await Swal.fire({
                title: 'حذف كلي؟',
                text: "سيتم مسح كل شيء من القاعدتين!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'احذف القاعدة'
            });
            if (result.isConfirmed) {
                await Promise.all([
                    remove(ref(dbMD, "MD/customers")),
                    remove(ref(dbPass, "MD_Pass/customers"))
                ]);
                loadDataFromFirebase();
            }
        };

        // ===== DELETE CUSTOMER =====
        window.deleteCustomer = async function (cID) {
            const result = await Swal.fire({
                title: 'حذف مشترك؟',
                text: `هل تريد حذف ${allCustomers[cID]?.metername || cID} وجميع عداداته؟`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'نعم، احذف الكل'
            });
            if (result.isConfirmed) {
                await Promise.all([
                    remove(ref(dbMD, `MD/customers/${cID}`)),
                    remove(ref(dbPass, `MD_Pass/customers/${cID}`))
                ]);
                loadDataFromFirebase();
            }
        };

        // ===== DELETE METER =====
        window.deleteMeter = async function (cID, mKey) {
            const result = await Swal.fire({
                title: 'حذف العداد؟',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'نعم، احذف'
            });
            if (result.isConfirmed) {
                await Promise.all([
                    remove(ref(dbMD, `MD/customers/${cID}/meters/${mKey}`)),
                    remove(ref(dbPass, `MD_Pass/customers/${cID}/meters/${mKey}`))
                ]);
                loadDataFromFirebase();
            }
        };

        // ===== RENDER CARDS =====
        function renderCards() {
            const grid = document.getElementById("cardsGrid");
            grid.innerHTML = "";
            for (let id in allCustomers) {
                const c = allCustomers[id];
                const meters = c.meters || {};
                const card = document.createElement("div");
                card.className = "grouped-card";
                card.innerHTML = `
                    <div class="card-header-main" onclick="fillCustomerEdit('${id}')">
                        <div>
                            <span class="customer-title">👤 ${c.metername}</span>
                            <div class="merged-info-grid">
                                <div class="info-item">🏗️ القطاع: ${c.keta3}</div>
                                <div class="info-item">📐 الهندسة: ${c.handsa}</div>
                                <div class="info-item">📊 معامل القدرة: ${c.power_factor}</div>
                                <div class="info-item">⚖️ أقصى حمل: ${c.max_load}</div>
                                <div class="info-item">📅 تاريخ اخر مرور: ${c.passing_date}</div>
                                <div class="info-item">🔢 عدد العدادات: ${Object.keys(meters).length}</div>
                            </div>
                        </div>
                        <button class="delete-customer-btn" onclick="event.stopPropagation(); deleteCustomer('${id}')">🗑️ حذف المشترك</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="sub-records-table">
                            <thead><tr>
                                <th>رقم العداد</th><th>ك وات</th><th>ك فار</th><th>محول جهد</th><th>محول تيار</th><th>الثابت</th><th>المكان</th><th>النوع</th><th>الرفع</th><th>التركيب</th><th>الأطلاق</th><th>ملاحظات</th><th>حذف</th>
                            </tr></thead>
                            <tbody>
                                ${Object.keys(meters).map(mKey => `
                                    <tr onclick="fillMeterEdit('${id}', '${mKey}')">
                                        <td><b>${meters[mKey].meternumber}</b></td>
                                        <td>${meters[mKey].kwh_reading}</td>
                                        <td>${meters[mKey].kvarh_reading}</td>
                                        <td>${meters[mKey].vt_ratio}</td>
                                        <td>${meters[mKey].ct_ratio}</td>
                                        <td>${meters[mKey].constant}</td>
                                        <td>${meters[mKey].location}</td>
                                        <td>${meters[mKey].metertype}</td>
                                        <td>${meters[mKey].inspection_date}</td>
                                        <td>${meters[mKey].fix_date}</td>
                                        <td>${meters[mKey].power_date}</td>
                                        <td>${meters[mKey].meternotes}</td>
                                        <td class="delete-btn" onclick="event.stopPropagation(); deleteMeter('${id}', '${mKey}')">🗑️</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        // ===== EDIT FUNCTIONS =====
        let editIDs = { cID: null, mKey: null };

        window.fillCustomerEdit = function (id) {
            clearForm();
            editIDs.cID = id;
            const c = allCustomers[id];
            if (!c) {
                Swal.fire("خطأ", "بيانات المشترك غير موجودة", "error");
                return;
            }
            document.getElementById("mname").value = c.metername || "";
            document.getElementById("keta3").value = c.keta3 || "";
            document.getElementById("handsa").value = c.handsa || "";
            document.getElementById("power_factor").value = c.power_factor || "";
            document.getElementById("max_load").value = c.max_load || "";
            document.getElementById("passing_date").value = c.passing_date || "";
            document.getElementById("variableSection").style.display = "none";
            document.querySelectorAll("#fixedSection input, #fixedSection textarea").forEach(i => i.disabled = false);
            document.getElementById("updateAllBtn").disabled = false;
            document.getElementById("customerModeTag").style.display = "block";
            document.getElementById("updateAllBtn").style.display = "block";
            document.getElementById("saveBtn").style.display = "none";
            document.getElementById("addMeterBtn").style.display = "none";
        };

        window.fillMeterEdit = function (cID, mKey) {
            clearForm();
            editIDs = { cID: cID, mKey: mKey };
            const c = allCustomers[cID];
            if (!c) {
                Swal.fire("خطأ", "بيانات المشترك غير موجودة", "error");
                return;
            }
            const m = c.meters ? c.meters[mKey] : null;
            if (!m) {
                Swal.fire("خطأ", "بيانات العداد غير موجودة", "error");
                return;
            }

            document.getElementById("mname").value = c.metername || "";
            document.getElementById("keta3").value = c.keta3 || "";
            document.getElementById("handsa").value = c.handsa || "";
            document.getElementById("power_factor").value = c.power_factor || "";
            document.getElementById("max_load").value = c.max_load || "";
            document.getElementById("passing_date").value = c.passing_date || "";

            document.getElementById("mno").value = m.meternumber || "";
            document.getElementById("kwh_reading").value = m.kwh_reading || "";
            document.getElementById("kvarh_reading").value = m.kvarh_reading || "";
            document.getElementById("vt_ratio").value = m.vt_ratio || "";
            document.getElementById("ct_ratio").value = m.ct_ratio || "";
            document.getElementById("constant").value = m.constant || "";
            document.getElementById("location").value = m.location || "";
            document.getElementById("mtype").value = m.metertype || "";
            document.getElementById("inspection_date").value = m.inspection_date || "";
            document.getElementById("fix_date").value = m.fix_date || "";
            document.getElementById("power_date").value = m.power_date || "";
            document.getElementById("notes").value = m.meternotes || "";

            document.querySelectorAll("#fixedSection input, #fixedSection textarea").forEach(i => i.disabled = true);
            document.querySelectorAll("#variableSection input, #variableSection textarea").forEach(i => i.disabled =
                false);
            document.getElementById("variableSection").style.display = "block";
            document.getElementById("saveBtn").disabled = false;
            document.getElementById("meterModeTag").style.display = "block";
            document.getElementById("saveBtn").style.display = "block";
            document.getElementById("addMeterBtn").style.display = "block";
        };

        // ===== QUICK SAVE =====
        window.quickSave = async function () {
            const mNoRaw = document.getElementById("mno").value.trim();
            if (!mNoRaw || !editIDs.cID) return Swal.fire("تنبيه", "يجب اختيار مشترك وتحديد رقم العداد", "warning");
            const finalMKey = editIDs.mKey || sanitizeKey(mNoRaw);
            const meterData = {
                meternumber: mNoRaw,
                kwh_reading: document.getElementById("kwh_reading").value,
                kvarh_reading: document.getElementById("kvarh_reading").value,
                vt_ratio: document.getElementById("vt_ratio").value,
                ct_ratio: document.getElementById("ct_ratio").value,
                constant: document.getElementById("constant").value,
                location: document.getElementById("location").value,
                metertype: document.getElementById("mtype").value,
                inspection_date: document.getElementById("inspection_date").value,
                fix_date: document.getElementById("fix_date").value,
                power_date: document.getElementById("power_date").value,
                meternotes: document.getElementById("notes").value
            };
            try {
                await Promise.all([
                    update(ref(dbMD, `MD/customers/${editIDs.cID}/meters/${finalMKey}`), meterData),
                    update(ref(dbPass, `MD_Pass/customers/${editIDs.cID}/meters/${finalMKey}`), meterData)
                ]);
                Swal.fire("تم", "تم الحفظ بنجاح", "success");
                loadDataFromFirebase();
                clearForm();
            } catch (error) {
                console.error("خطأ في الحفظ:", error);
                Swal.fire("خطأ", "فشل الحفظ: " + error.message, "error");
            }
        };

        // ===== ADD NEW METER =====
        window.addNewMeter = async function () {
            if (!editIDs.cID) {
                return Swal.fire("تنبيه", "يرجى اختيار مشترك أولاً من القائمة لإضافة عداد جديد له", "warning");
            }

            const mNoRaw = document.getElementById("mno").value.trim();
            if (!mNoRaw) {
                return Swal.fire("تنبيه", "يرجى إدخال رقم العداد (Key) الجديد", "warning");
            }

            const newMKey = sanitizeKey(mNoRaw);

            if (allCustomers[editIDs.cID]?.meters?.[newMKey]) {
                return Swal.fire("تنبيه", "هذا العداد موجود بالفعل للمشترك المصرّح له. استخدم 'حفظ/تحديث العداد' للتعديل عليه.",
                    "warning");
            }

            const meterData = {
                meternumber: mNoRaw,
                kwh_reading: document.getElementById("kwh_reading").value || 0,
                kvarh_reading: document.getElementById("kvarh_reading").value || 0,
                vt_ratio: document.getElementById("vt_ratio").value || "",
                ct_ratio: document.getElementById("ct_ratio").value || "",
                constant: document.getElementById("constant").value || 1,
                location: document.getElementById("location").value || "",
                metertype: document.getElementById("mtype").value || "",
                inspection_date: document.getElementById("inspection_date").value || "",
                fix_date: document.getElementById("fix_date").value || "",
                power_date: document.getElementById("power_date").value || "",
                meternotes: document.getElementById("notes").value || ""
            };

            try {
                await Promise.all([
                    set(ref(dbMD, `MD/customers/${editIDs.cID}/meters/${newMKey}`), meterData),
                    set(ref(dbPass, `MD_Pass/customers/${editIDs.cID}/meters/${newMKey}`), meterData)
                ]);
                Swal.fire("تم", "تم إضافة العداد الجديد بنجاح", "success");
                loadDataFromFirebase();
                clearForm();
            } catch (error) {
                console.error("خطأ في إضافة العداد:", error);
                Swal.fire("خطأ", "فشل في إضافة العداد: " + error.message, "error");
            }
        };

        // ===== UPDATE CUSTOMER =====
        window.updateCustomerData = async function () {
            if (!editIDs.cID) {
                Swal.fire("تنبيه", "لم يتم تحديد مشترك", "warning");
                return;
            }

            const mname = document.getElementById("mname").value;
            const oldCID = editIDs.cID;
            const newCID = sanitizeKey(mname);

            const updatedInfo = {
                metername: mname,
                name: mname,
                keta3: document.getElementById("keta3").value,
                handsa: document.getElementById("handsa").value,
                power_factor: document.getElementById("power_factor").value,
                max_load: document.getElementById("max_load").value,
                passing_date: document.getElementById("passing_date").value
            };

            try {
                if (oldCID !== newCID) {
                    const [oldPassData, oldMDData] = await Promise.all([
                        get(ref(dbPass, `MD_Pass/customers/${oldCID}`)),
                        get(ref(dbMD, `MD/customers/${oldCID}`))
                    ]);

                    if (!oldPassData.exists() && !oldMDData.exists()) {
                        Swal.fire("خطأ", "المشترك غير موجود في قاعدة البيانات", "error");
                        return;
                    }

                    const dbPassUpdates = {};
                    const dbMDUpdates = {};

                    if (oldPassData.exists()) {
                        dbPassUpdates[`MD_Pass/customers/${newCID}`] = { ...oldPassData.val(), ...updatedInfo };
                        dbPassUpdates[`MD_Pass/customers/${oldCID}`] = null;
                    }

                    if (oldMDData.exists()) {
                        dbMDUpdates[`MD/customers/${newCID}`] = { ...oldMDData.val(), ...updatedInfo };
                        dbMDUpdates[`MD/customers/${oldCID}`] = null;
                    }

                    await Promise.all([
                        Object.keys(dbPassUpdates).length ? update(ref(dbPass), dbPassUpdates) : null,
                        Object.keys(dbMDUpdates).length ? update(ref(dbMD), dbMDUpdates) : null
                    ]);

                    editIDs.cID = newCID;

                } else {
                    await Promise.all([
                        update(ref(dbPass, `MD_Pass/customers/${oldCID}`), updatedInfo),
                        update(ref(dbMD, `MD/customers/${oldCID}`), updatedInfo)
                    ]);
                }

                Swal.fire("تم", "تم تحديث البيانات بنجاح", "success");
                clearForm();
                loadDataFromFirebase();

            } catch (error) {
                console.error("خطأ في التحديث:", error);
                Swal.fire("خطأ", "فشل التحديث: " + error.message, "error");
            }
        };

        // ===== CLEAR FORM =====
        window.clearForm = function () {
            editIDs = { cID: null, mKey: null };
            document.querySelectorAll("input, textarea").forEach(i => { i.value = ""; i.disabled = false; });
            document.getElementById("variableSection").style.display = "block";
            document.getElementById("customerModeTag").style.display = "none";
            document.getElementById("meterModeTag").style.display = "none";
            document.getElementById("updateAllBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "block";
            document.getElementById("addMeterBtn").style.display = "block";
            document.getElementById("updateAllBtn").disabled = false;
            document.getElementById("saveBtn").disabled = false;
        };

        // ===== SEARCH =====
        document.getElementById("searchInput").addEventListener("input", function (e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll(".grouped-card");
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
            });
        });

        // ===== INIT =====
        loadDataFromFirebase();
    </script>
</body>

</html>
