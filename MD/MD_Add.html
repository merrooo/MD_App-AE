<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إضافة مشترك وعدادات - نظام الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .form-container {
            width: 100%;
            max-width: 950px;
            background: var(--white);
            padding: 30px 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            align-self: flex-start;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 12px;
            margin: 0 0 30px 0;
            font-size: 1.5rem;
        }

        /* ===== DROPDOWN STYLES ===== */
        .record-date-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 12px 20px;
            background: #f8fafc;
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .modern-dropdown {
            position: relative;
            min-width: 220px;
            flex: 1;
        }

        .dropdown-btn {
            background: var(--primary);
            color: var(--white);
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            transition: all 0.3s ease;
            gap: 10px;
        }

        .dropdown-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
        }

        .dropdown-btn .arrow {
            font-size: 0.7rem;
            transition: transform 0.3s ease;
            opacity: 0.8;
        }

        .dropdown-btn .arrow.open {
            transform: rotate(180deg);
        }

        .dropdown-btn .icon-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 2000;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            animation: dropdownFade 0.25s ease;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s ease;
            color: var(--primary);
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #f1f5f9;
            color: var(--accent);
            padding-right: 28px;
        }

        .dropdown-item .item-icon {
            font-size: 1.1rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .dropdown-item .item-label {
            flex: 1;
        }

        .dropdown-item .item-badge {
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* ===== DATE INPUT ===== */
        .date-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            padding: 6px 14px 6px 6px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .date-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .date-group input[type="date"] {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: var(--primary);
            outline: none;
            transition: border 0.2s;
            min-width: 150px;
        }

        .date-group input[type="date"]:focus {
            border-color: var(--accent);
        }

        /* ===== REST OF FORM ===== */
        .section-title {
            background: #f8fafc;
            padding: 10px 15px;
            border-right: 4px solid var(--accent);
            margin: 20px 0 15px 0;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 6px 6px 0;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #475569;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            background: var(--white);
            transition: border 0.2s, box-shadow 0.2s;
            color: var(--primary);
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .row-flex {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .row-flex .input-group {
            flex: 1;
            min-width: 170px;
        }

        .meter-card {
            background: #fafcff;
            border: 2px solid #e2e8f0;
            padding: 18px 20px 10px 20px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            transition: border-color 0.3s;
        }

        .meter-card:hover {
            border-color: var(--accent);
        }

        .remove-meter-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            transition: background 0.2s;
        }

        .remove-meter-btn:hover {
            background: #b91c1c;
        }

        .btn-add-meter {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 20px;
        }

        .btn-add-meter:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-submit {
            background: var(--success);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.25);
        }

        .btn-submit:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            text-align: right;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .form-container {
                padding: 18px 16px;
            }

            .record-date-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .modern-dropdown {
                min-width: 100%;
            }

            .date-group {
                width: 100%;
            }

            .date-group input[type="date"] {
                flex: 1;
                min-width: 0;
            }

            .row-flex .input-group {
                min-width: 100%;
            }

            .dropdown-menu {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: var(--radius) var(--radius) 0 0;
                max-height: 60vh;
                overflow-y: auto;
                animation: slideUp 0.3s ease;
            }

            @keyframes slideUp {
                from {
                    transform: translateY(100%);
                }

                to {
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528",
            measurementId: "G-W3TZ1EKWWN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        try {
            getAnalytics(app);
        } catch (err) {
            console.warn("Analytics disabled:", err);
        }

        let meterCount = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('record_date').value = today;

            // Dropdown toggle
            const btn = document.getElementById('dropdownBtn');
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('arrow');

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                menu.classList.toggle('show');
                arrow.classList.toggle('open');
            });

            const items = document.querySelectorAll('.dropdown-item');
            items.forEach(item => {
                item.addEventListener('click', function () {
                    const page = this.getAttribute('data-page');
                    if (page) {
                        window.location.href = page;
                    }
                });
            });

            window.addEventListener('click', function () {
                if (menu.classList.contains('show')) {
                    menu.classList.remove('show');
                    arrow.classList.remove('open');
                }
            });
        });

        window.addNewMeterForm = function () {
            const container = document.getElementById('meters-list');
            const newMeter = document.createElement('div');
            newMeter.className = 'meter-card';
            newMeter.id = `meter-${meterCount}`;
            newMeter.innerHTML = `
                <div class="section-title">
                    <span>⚡ بيانات العداد (${meterCount + 1})</span>
                    <button class="remove-meter-btn" onclick="document.getElementById('meter-${meterCount}').remove()">✕ حذف</button>
                </div>
                <div class="row-flex">
                    <div class="input-group"><label>رقم العداد</label><input type="text" class="mno"></div>
                    <div class="input-group"><label>نوع العداد</label><input class="mtype"></div>
                    <div class="input-group"><label>تاريخ التركيب</label><input type="date" class="fix_date"></div>
                    <div class="input-group"><label>تاريخ الإطلاق</label><input type="date" class="power_date"></div>
                </div>
                <div class="row-flex">
                    <div class="input-group"><label>قراءة kWh</label><input type="number" class="kwh"></div>
                    <div class="input-group"><label>قراءة kVARh</label><input type="number" class="kvarh"></div>
                    <div class="input-group"><label>الثابت</label><input type="number" class="constant" value="1"></div>
                </div>
                <div class="row-flex">
                    <div class="input-group"><label>VT Ratio</label><input class="vt" value="11000/110"></div>
                    <div class="input-group"><label>CT Ratio</label><input class="ct" value="200/5"></div>
                    <div class="input-group"><label>المكان</label><input class="loc"></div>
                </div>
                <div class="input-group"><label>ملاحظات العداد</label><textarea class="m-notes" rows="1"></textarea></div>
            `;
            container.appendChild(newMeter);
            meterCount++;
        }

        function sanitizeKey(key) {
            return String(key).replace(/[.#$\[\]\(\)\/\s]/g, "").trim();
        }

        window.saveAllToFirebase = async function () {
            const mname = document.getElementById("mname").value.trim();
            if (!mname) return Swal.fire("خطأ", "يرجى إدخال اسم المشترك", "error");

            const customerKey = sanitizeKey(mname);
            const meterCards = document.querySelectorAll('.meter-card');
            const recordDate = document.getElementById('record_date').value;

            try {
                Swal.fire({ title: 'جاري التحقق والحفظ...', didOpen: () => Swal.showLoading() });

                const snapshot = await get(ref(db, `MD/customers/${customerKey}`));
                if (snapshot.exists()) {
                    return Swal.fire({
                        icon: 'warning',
                        title: 'المشترك موجود مسبقاً',
                        text: 'هذا الاسم مسجل بالفعل. لا يمكنك إضافة مشترك بنفس الاسم.',
                        confirmButtonText: 'حسناً'
                    });
                }

                let metersData = {};
                let hasError = false;

                meterCards.forEach(card => {
                    const mno = card.querySelector('.mno').value.trim();
                    if (!mno) { hasError = true; return; }

                    const mKey = sanitizeKey(mno);
                    metersData[mKey] = {
                        meternumber: mno,
                        metertype: card.querySelector('.mtype').value || "",
                        record_date: recordDate,
                        fix_date: card.querySelector('.fix_date').value || "",
                        power_date: card.querySelector('.power_date').value || "",
                        kwh_reading: card.querySelector('.kwh').value || 0,
                        kvarh_reading: card.querySelector('.kvarh').value || 0,
                        constant: card.querySelector('.constant').value || 1,
                        vt_ratio: card.querySelector('.vt')?.value || "11000/110",
                        ct_ratio: card.querySelector('.ct')?.value || "200/5",
                        location: card.querySelector('.loc').value || "",
                        note: card.querySelector('.m-notes')?.value || ""
                    };
                });

                if (hasError) return Swal.fire("تنبيه", "تأكد من كتابة رقم العداد لكل العدادات", "warning");

                const finalData = {
                    metername: mname,
                    keta3: document.getElementById("keta3").value || "-",
                    handsa: document.getElementById("handsa").value || "-",
                    power_factor: document.getElementById("power_factor").value || 0,
                    max_load: document.getElementById("max_load").value || 0,
                    meters: metersData
                };

                await set(ref(db, `MD/customers/${customerKey}`), finalData);

                Swal.fire("تم الحفظ!", "تم تسجيل المشترك والعدادات بنجاح", "success")
                    .then(() => location.reload());

            } catch (e) {
                Swal.fire("خطأ", e.message, "error");
            }
        };
    </script>
</body>

</html>
