<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محضر رفع / تركيب / مراجعة عداد ثلاثي 5 امبير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #eef2f6;
            color: #000;
            direction: rtl;
            padding: 10px 0;
        }

        .actions-toolbar {
            max-width: 350mm;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .actions-toolbar .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: #1e40af;
            color: #fff;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-success {
            background: #0b7e3d;
            color: #fff;
        }

        .btn-danger {
            background: #b91c1c;
            color: #fff;
        }

        .controls-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
            font-size: 12px;
        }

        .control-group select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            background-color: #f8fafc;
        }

        .page {
            width: 350mm;
            margin: 0 auto;
            background: #fff;
            padding: 6mm 10mm;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            position: relative;
            min-height: 297mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2px;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 4px;
        }

        .header-left-logo,
        .header-right-title {
            font-size: 10px;
            font-weight: bold;

        }

        .header-left-logo {
            text-align: right;
        }

        .header-right-title {
            text-align: left;
        }

        .form-main-title {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            margin: 6px 0 10px 0;
            color: #1e40af;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            row-gap: 4px;
            column-gap: 20px;
            margin-bottom: 6px;
        }

        .info-field {
            display: flex;
            align-items: baseline;
            padding: 2px 0;
        }

        .info-label {
            font-weight: 700;

        }

        .info-value {
            flex: 1;
            font-weight: 600;
            padding-right: 4px;
            font-size: 11.5px;
            min-width: 120px;
        }

        .info-field.compact .info-label {
            min-width: 60px;
            margin-left: 4px;
        }

        .info-field.compact .info-value {
            min-width: 70px;

        .table-section-title {
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            margin: 4px 0 2px 0;
            color: #1e40af;
        }

        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
            text-align: center;
        }

        table.form-table th,
        table.form-table td {
            border: 1px solid #000;
            padding: 1px 2px;
            font-size: 10.5px;
            line-height: 1.1;
        }

        table.form-table th {
            background-color: #f8fafc;

            color: #333;
            height: 22px;
        }

        table.form-table td {
            height: 22px;
        }

        .signature-section {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 15px;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;

        .committee-box {
            display: flex;
            flex-direction: column;

        .select-row {
            display: flex;
            align-items: center;

        .member-number {

        }

        .inline-select {
            width: 100%;
            height: 36px;
            padding: 2px;
            border: 1px solid #ffffff;
            font-size: 10.5px;
            background: #ffffff;
            border-radius: 4px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            text-align: right;
            text-align-last: right;
        }

        .sig-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sig-line-dotted {
            border-bottom: 1.5px dashed #666;
            margin-top: 12px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .header-logo-img {
            width: 60px;
            height: auto;
            display: block;
        }

        .btn-add-meters {
            background: #0b7e3d;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-add-meters:hover {
            background: #0a6a33;
        }

        .btn-reset-rows {
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-reset-rows:hover {
            background: #991b1b;
        }

        .meter-action-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .table-wrapper {
            position: relative;
        }

        .notes-inside {
            grid-column: 1 / -1;
            margin-bottom: 4px;
        }

        .notes-inside .notes-title {
            font-weight: 700;
            font-size: 11px;
            color: #1e40af;
            margin-bottom: 2px;
            display: block;
        }

        .notes-inside .empty-line {
            height: 18px;
            width: 100%;
        }

        /* ===== ✅ الملاحظات: كل العدادات على نفس السطر (inline) بدون ترقيم ===== */
        .notes-inside .notes-container-inline {
            font-size: 11px;
            line-height: 1.9;
            color: #333;
            display: block;
            padding: 2px 0;
        }

        .notes-inside .note-item {
            display: inline-block;
            margin-left: 14px;
            max-width: 100%;
            vertical-align: top;
        }

        .notes-inside .note-item:last-child {
            margin-left: 0;
        }

        .notes-inside .note-meter-label {
            font-weight: 700;
            color: #1e40af;
            font-size: 11px;
            white-space: nowrap;
        }

        .notes-inside .note-meter-text {
            font-weight: 600;
            color: #333;
            font-size: 11px;
            word-break: break-word;
        }

        .notes-inside .note-meter-text.muted {
            color: #94a3b8;
            font-style: italic;
            font-weight: 500;
        }

        .notes-inside .notes-empty-msg {
            text-align: center;
            padding: 6px 0;
            color: #94a3b8;
            font-style: italic;
            font-size: 11px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 3mm 4mm;
            }

            html,
            body {
                height: 100% !important;
                margin: 0 !important;

            }

            body {
                background: white !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .actions-toolbar {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
            }

            .page {
                box-shadow: none !important;
                border: 2px solid #1e40af !important;
                margin: 0 !important;
                padding: 3mm 5mm !important;
                width: 100% !important;
                height: 100% !important;
                min-height: 100vh !important;
                max-height: 100vh !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                overflow: hidden !important;
                position: relative !important;
            }

            .header-left-logo,
            .header-right-title {
                font-size: 4pt !important;
                line-height: 1.2 !important;
            }

            .form-main-title {
                font-size: 6.5pt !important;
                margin: 2px 0 3px 0 !important;
            }

            .info-label,
            .info-value {
                font-size: 4pt !important;
            }

            .info-label {
                min-width: 40px !important;
                margin-left: 4px !important;
            }

            .info-grid {
                row-gap: 1px !important;
                margin-bottom: 2px !important;
                grid-template-columns: 2fr 1fr 1fr !important;
            }

            .table-section-title {
                font-size: 5.5pt !important;
                margin: 2px 0 1px 0 !important;
            }

            table.form-table th,
            table.form-table td {
                font-size: 4.5pt !important;
                height: 16px !important;
                padding: 0px 1px !important;
                line-height: 1.0 !important;
            }

            table.form-table th {
                height: 16px !important;
                padding: 0 1px !important;
            }

            .notes-inside .notes-title {
                font-size: 4pt !important;
                margin-bottom: 1px !important;
            }

            .notes-inside .empty-line {
                height: 12px !important;
            }

            .notes-inside .notes-container-inline {
                font-size: 4pt !important;
                line-height: 1.5 !important;
                padding: 1px 0 !important;
            }

            .notes-inside .note-item {
                margin-left: 6px !important;
            }

            .notes-inside .note-meter-label,
            .notes-inside .note-meter-text {

            .notes-inside .notes-empty-msg {

            .signature-section {

            .committee-box p,
            .sig-box p {

                min-width: 10px !important;
            }

            .select-row {

            }

            .sig-line-dotted {

            }

            .btn-add-meters,
            .btn-reset-rows {

            }

            .header-logo-img {

            }

            table.form-table {

            }

            .form-header,
            .info-grid,
            .table-section-title,
            table.form-table {

            .signature-section {

            }
        }

        .status-msg {
            text-align: center;

</head>

<body>

    <div class="actions-toolbar">
        <button class="btn btn-secondary" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع</button>
        <div class="controls-wrap">
            <div class="control-group">
                <label for="dateSelect"><i class="fas fa-calendar-alt"></i> التاريخ:</label>
                <select id="dateSelect" onchange="onDateChange(this.value)"></select>
            </div>
            <div class="control-group">
                <label for="processSelect"><i class="fas fa-tasks"></i> نوع العملية:</label>
                <select id="processSelect" onchange="onProcessTypeChange(this.value)">
                    <option value="مراجعة" selected>مراجعة</option>
                    <option value="رفع-تركيب">رفع - تركيب</option>
                </select>
            </div>
            <div class="control-group" id="installedMeterGroup" style="display: none;">
                <label for="installedMeterSelect">العداد المركب:</label>
                <select id="installedMeterSelect" onchange="onInstalledMeterChange()"></select>
            </div>
            <div class="control-group" id="removedMeterGroup" style="display: none;">
                <label for="removedMeterSelect">العداد المرفوع:</label>
                <div class="meter-action-wrap">
                    <select id="removedMeterSelect"></select>
                    <button class="btn-add-meters" onclick="applyMeterSelection()"><i class="fas fa-plus"></i>
                        إضافة</button>
                    <button class="btn-reset-rows" onclick="resetAddedRows()"><i class="fas fa-undo"></i> إعادة</button>
                </div>
            </div>
        </div>
        <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> طباعة / PDF</button>
    </div>

    <div class="page" id="formContainer">
        <div class="status-msg" id="loadingState"><i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528",
            measurementId: "G-W3TZ1EKWWN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('customerId');

        // ============ الحالة العامة ============
        let archiveData = {};
        let allVisits = {};
        let customerMeters = {};
        let customerMasterData = {};
        let archiveRemovedMeters = [];
        let selectedDate = '';

        let addedInstalledRows = [];
        let addedRemovedRows = [];

        if (!customerId) {
            document.getElementById('formContainer').innerHTML = `
            <div class="status-msg" style="color: red;"><i class="fas fa-exclamation-triangle"></i> لم يتم تحديد المشترك</div>
        `;
        } else {
            fetchCustomerData();
        }

        // ============ Helpers ============
        function toYYYYMMDD(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function compareDates(date1, date2) {
            if (!date1 || !date2) return 0;
            if (date1 === date2) return 0;
            return date1 < date2 ? -1 : 1;
        }

        // ============ تحويل لقطة الأرشيف لشكل الكود ============
        function applyArchiveSnapshot(snapshot) {
            if (!snapshot) return;

            customerMasterData = {
                metername: snapshot.metername || '',
                keta3: snapshot.keta3 || '',
                handsa: snapshot.handsa || '',
                power_factor: snapshot.power_factor || '',
                max_load: snapshot.max_load || '',
                location: snapshot.location || '',
                activity: snapshot.activity || ''
            };

            customerMeters = {};
            if (snapshot.meters) {
                for (let mNum in snapshot.meters) {
                    const m = snapshot.meters[mNum];
                    const actualNum = m.meternumber || mNum;
                    const currentKwh = (m.new_kwh !== undefined && m.new_kwh !== null && m.new_kwh !== '') ? m.new_kwh : (m.prev_kwh || 0);
                    const currentKvarh = (m.new_kvarh !== undefined && m.new_kvarh !== null && m.new_kvarh !== '') ? m.new_kvarh : (m.prev_kvarh || 0);

                    customerMeters[actualNum] = {
                        ...m,
                        meternumber: actualNum,
                        metertype: m.metertype || '',
                        location: m.location || '',
                        constant: m.constant || '',
                        vt_ratio: m.vt_ratio || '',
                        ct_ratio: m.ct_ratio || '',
                        kwh_reading: currentKwh,
                        kvarh_reading: currentKvarh,
                        kwh: currentKwh,
                        kvarh: currentKvarh,
                        note: m.note || ''
                    };
                }
            }
        }

        // ============ بناء قائمة العدادات المرفوعة من الأرشيف ============
        function buildArchiveRemovedMeters() {
            archiveRemovedMeters = [];
            const seenMeters = {};

            const archiveDates = Object.keys(archiveData).sort((a, b) => {
                const aD = toYYYYMMDD(a);
                const bD = toYYYYMMDD(b);
                return compareDates(bD, aD);
            });

            for (const date of archiveDates) {
                const snapshot = archiveData[date];
                if (!snapshot || !snapshot.meters) continue;

                for (const mNum in snapshot.meters) {
                    const m = snapshot.meters[mNum];
                    const actualNum = m.meternumber || mNum;

                    if (!seenMeters[actualNum]) {
                        seenMeters[actualNum] = true;
                        archiveRemovedMeters.push({
                            meternumber: actualNum,
                            date: date,
                            data: m
                        });
                    }
                }
            }

            console.log('📦 Archive removed meters:', archiveRemovedMeters.length);
        }

        // ============ تحميل البيانات من MD_Archive ============
        async function fetchCustomerData() {
            try {
                console.log('🔍 Fetching MD_Archive for customer:', customerId);

                const archiveSnap = await get(ref(db, `MD_Archive/customers/${customerId}`));

                if (!archiveSnap.exists()) {
                    document.getElementById('formContainer').innerHTML = `
                    <div class="status-msg" style="color: red;">
                        <i class="fas fa-exclamation-triangle"></i>
                        لا توجد بيانات مؤرشفة لهذا المشترك في MD_Archive
                    </div>
                `;
                    return;
                }

                archiveData = archiveSnap.val();
                allVisits = archiveData;

                const dates = Object.keys(archiveData)
                    .filter(d => /^\d{2}-\d{2}-\d{4}$/.test(d) && typeof archiveData[d] === 'object')
                    .sort((a, b) => compareDates(toYYYYMMDD(b), toYYYYMMDD(a)));

                if (dates.length === 0) {
                    document.getElementById('formContainer').innerHTML = `
                    <div class="status-msg" style="color: red;">لا توجد لقطات صالحة في الأرشيف</div>
                `;
                    return;
                }

                selectedDate = dates[0];

                const dateSelect = document.getElementById('dateSelect');
                dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');

                applyArchiveSnapshot(archiveData[selectedDate]);
                buildArchiveRemovedMeters();

                onDateChange(selectedDate);

            } catch (error) {
                console.error('❌ Error fetching data:', error);
                document.getElementById('formContainer').innerHTML = `
                <div class="status-msg" style="color:red;">حدث خطأ أثناء تحميل البيانات: ${error.message}</div>
            `;
            }
        }

        window.onDateChange = function (dateKey) {
            selectedDate = dateKey;

            if (archiveData[dateKey]) {
                applyArchiveSnapshot(archiveData[dateKey]);
            }

            addedInstalledRows = [];
            addedRemovedRows = [];
            populateMeterSelectors();
            renderCurrentState();
        };

        // ============ تغيير اختيار العداد المركب ============
        window.onInstalledMeterChange = function () {
            const processType = document.getElementById('processSelect').value;
            if (processType === 'رفع-تركيب' && addedInstalledRows.length === 0) {
                renderCurrentState();
            }
        };

        // ============ تعبئة القوائم المنسدلة ============
        function populateMeterSelectors() {
            const processType = document.getElementById('processSelect').value;
            const installedSelect = document.getElementById('installedMeterSelect');
            const removedSelect = document.getElementById('removedMeterSelect');

            if (processType === 'رفع-تركيب') {
                // العداد المركب ← من اللقطة الحالية
                const installedAddedNums = addedInstalledRows.map(r => r.meterNumber || r.meternumber);
                const installedKeys = Object.keys(customerMeters).filter(k => {
                    const mNum = customerMeters[k].meternumber || k;
                    return !installedAddedNums.includes(mNum);
                });
                installedSelect.innerHTML = installedKeys.length
                    ? installedKeys.map(k => {
                        const m = customerMeters[k];
                        return `<option value="${k}">${m.meternumber || k}</option>`;
                    }).join('')
                    : `<option value="">لا توجد عدادات متاحة</option>`;

                // العداد المرفوع ← من كل تواريخ الأرشيف (بدون عرض التاريخ)
                const removedAddedNums = addedRemovedRows.map(r => r.meterNumber || r.meternumber);
                const availableRemoved = archiveRemovedMeters.filter(
                    r => !removedAddedNums.includes(r.meternumber)
                );
                removedSelect.innerHTML = availableRemoved.length
                    ? availableRemoved.map(r =>
                        `<option value="${r.meternumber}">${r.meternumber}</option>`
                    ).join('')
                    : `<option value="">لا توجد عدادات متاحة</option>`;

            } else {
                // وضع المراجعة
                const availableKeys = Object.keys(customerMeters).filter(k => {
                    const mNum = customerMeters[k].meternumber || k;
                    return !addedInstalledRows.some(r => (r.meterNumber || r.meternumber) === mNum)
                        && !addedRemovedRows.some(r => (r.meterNumber || r.meternumber) === mNum);
                });

                const options = availableKeys.map(k => {
                    const m = customerMeters[k];
                    return `<option value="${k}">${m.meternumber || k}</option>`;
                }).join('');

                installedSelect.innerHTML = options || `<option value="">لا توجد عدادات متاحة</option>`;
                removedSelect.innerHTML = options || `<option value="">لا توجد عدادات متاحة</option>`;

                if (availableKeys.length > 0) {
                    installedSelect.value = availableKeys[0];
                    removedSelect.value = availableKeys[0];
                }
            }
        }

        window.onProcessTypeChange = function (processType) {
            const isSwap = (processType === 'رفع-تركيب');
            document.getElementById('installedMeterGroup').style.display = isSwap ? 'flex' : 'none';
            document.getElementById('removedMeterGroup').style.display = isSwap ? 'flex' : 'none';
            if (!isSwap) {
                addedInstalledRows = [];
                addedRemovedRows = [];
            }
            populateMeterSelectors();
            renderCurrentState();
        };

        // ============ إضافة الصفوف ============
        window.applyMeterSelection = function () {
            const processType = document.getElementById('processSelect').value;
            if (processType !== 'رفع-تركيب') {
                Swal.fire('تنبيه', 'هذه الميزة متاحة فقط في وضع "رفع - تركيب"', 'info');
                return;
            }

            const installedKey = document.getElementById('installedMeterSelect').value;
            const removedKey = document.getElementById('removedMeterSelect').value;

            let addedSomething = false;

            // العداد المركب
            if (installedKey && customerMeters[installedKey]) {
                const meterNum = customerMeters[installedKey].meternumber || installedKey;
                if (!addedInstalledRows.some(r => r.meterNumber === meterNum)) {
                    addedInstalledRows.push({
                        ...customerMeters[installedKey],
                        key: installedKey,
                        meterNumber: meterNum,
                        meternumber: meterNum
                    });
                    addedSomething = true;
                } else {
                    Swal.fire('تنبيه', 'العداد المحدد مضاف بالفعل في العداد المركب', 'warning');
                    return;
                }
            }

            // العداد المرفوع
            if (removedKey) {
                const archiveEntry = archiveRemovedMeters.find(r => r.meternumber === removedKey);
                if (archiveEntry && !addedRemovedRows.some(r => r.meterNumber === archiveEntry.meternumber)) {
                    addedRemovedRows.push({
                        ...archiveEntry.data,
                        key: archiveEntry.meternumber,
                        meterNumber: archiveEntry.meternumber,
                        meternumber: archiveEntry.meternumber,
                        archiveDate: archiveEntry.date
                    });
                    addedSomething = true;
                } else if (archiveEntry) {
                    Swal.fire('تنبيه', 'العداد المحدد مضاف بالفعل في العداد المرفوع', 'warning');
                    return;
                }
            }

            if (addedSomething) {
                populateMeterSelectors();
                renderCurrentState();
            }
        };

        window.resetAddedRows = function () {
            addedInstalledRows = [];
            addedRemovedRows = [];
            populateMeterSelectors();
            renderCurrentState();
        };

        window.renderCurrentState = function () {
            const visit = allVisits[selectedDate] || {};
            const processType = document.getElementById('processSelect').value;

            let installedReadings = [];
            let removedReadings = [];

            if (processType === 'رفع-تركيب') {
                installedReadings = addedInstalledRows.map(r => ({ ...r }));
                removedReadings = addedRemovedRows.map(r => ({ ...r }));
            } else {
                installedReadings = Object.keys(customerMeters).map(k => {
                    const m = customerMeters[k];
                    return { key: k, ...m };
                });
            }

            renderFormContent(visit, installedReadings, removedReadings, processType);
        };

        // ============ بناء محتوى الصفحة ============
        function renderFormContent(visit, installedReadings, removedReadings, processType) {
            const meterName = customerMasterData.metername || '';
            const maxLoad = customerMasterData.max_load || '';
            const powerFactor = customerMasterData.power_factor || '';

            // ===== مكان التركيب =====
            let location = customerMasterData.location || '';

            // في حالة رفع-تركيب: مكان التركيب يُؤخذ من العداد المركب
            if (processType === 'رفع-تركيب') {
                if (installedReadings.length > 0) {
                    const firstInstalled = installedReadings[0];
                    const mNum = firstInstalled.meternumber || firstInstalled.meterNumber || firstInstalled.key;
                    const permMeter = customerMeters[mNum];
                    location = (permMeter && permMeter.location)
                        ? permMeter.location
                        : (firstInstalled.location || location);
                } else {
                    const selKey = document.getElementById('installedMeterSelect')?.value;
                    const permMeter = customerMeters[selKey];
                    if (permMeter && permMeter.location) {
                        location = permMeter.location;
                    }
                }
            }

            // ✅ Fallback عام: إذا بقي مكان التركيب فارغاً (مثل وضع مراجعة)
            if (!location && installedReadings.length > 0) {
                const firstMeter = installedReadings[0];
                const mNum = firstMeter.meternumber || firstMeter.meterNumber || firstMeter.key;
                const permMeter = customerMeters[mNum];
                location = (permMeter && permMeter.location)
                    ? permMeter.location
                    : (firstMeter.location || '');
            }

            // ✅ الملاحظات: كل العدادات على نفس السطر (inline) - بدون ترقيم
            //    الشكل: العداد رقم (3) : مرور-2 العداد رقم (2) : مرور-4
            const allMetersForNotes = [...removedReadings, ...installedReadings];
            let notesHtml = '';
            if (allMetersForNotes.length > 0) {
                notesHtml = `<div class="notes-container-inline">` +
                    allMetersForNotes.map((r) => {
                        const meterNum = r.meternumber || r.meterNumber || r.key || '-';
                        const noteText = (r.note || r.notes || '').toString().trim();
                        const isEmpty = !noteText;
                        return `<span class="note-item">
                            <span class="note-meter-label">العداد رقم (${meterNum}) :</span>
                            <span class="note-meter-text ${isEmpty ? 'muted' : ''}">${isEmpty ? 'لا توجد ملاحظات' : noteText}</span>
                        </span>`;
                    }).join(' ') +
                `</div>`;
            } else {
                notesHtml = `<div class="notes-empty-msg">لا توجد عدادات مسجلة</div>`;
            }

            const formTitle = (processType === 'رفع-تركيب')
                ? 'محضر ( رفع / تركيب ) عداد ثلاثي قدرة 5 أمبير'
                : 'محضر ( مراجعة ) عداد ثلاثي قدرة 5 أمبير';

            const installedRowCount = Math.max(3, installedReadings.length);
            const removedRowCount = Math.max(3, removedReadings.length);

            let tablesHtml = '';

            if (processType === 'رفع-تركيب') {
                tablesHtml += `
                <div class="table-section-title">بيانات العداد المرفوع</div>
                <table class="form-table">
                    <thead>
                        <tr>
                            <th style="width: 3%;">م</th>
                            <th style="width: 13%;">رقم الشاسية</th>
                            <th style="width: 12%;">نوع العداد</th>
                            <th style="width: 12%;">القراءة ك.وات.س</th>
                            <th style="width: 12%;">القراءة ك.فار.س</th>
                            <th style="width: 10%;">محولات الجهد</th>
                            <th style="width: 10%;">محولات التيار</th>
                            <th style="width: 7%;">الثابت</th>
                            <th style="width: 10%;">تاريخ القراءة</th>
                            <th style="width: 11%;">مكان التركيب</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${generateRemovedTableRows(removedReadings, removedRowCount)}
                    </tbody>
                </table>
            `;
            }

            tablesHtml += `
            <div class="table-section-title">بيانات العداد المركب</div>
            <table class="form-table">
                <thead>
                    <tr>
                        <th style="width: 4%;">م</th>
                        <th style="width: 15%;">رقم الشاسية</th>
                        <th style="width: 13%;">نوع العداد</th>
                        <th style="width: 13%;">القراءة ك.وات.س</th>
                        <th style="width: 13%;">القراءة ك.فار.س</th>
                        <th style="width: 11%;">محولات الجهد</th>
                        <th style="width: 11%;">محولات التيار</th>
                        <th style="width: 10%;">الثابت</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateTableRows(installedReadings, installedRowCount)}
                </tbody>
            </table>
        `;

            // ===== مكان التركيب في العمود الواسع، أقصى حمل يمتد =====
            let infoGridHtml = `
            <div class="info-field" style="grid-column: 1;">
                <span class="info-label">اسم المشترك /</span>
                <span class="info-value" style="min-width: 180px;">${meterName}</span>
            </div>
            <div class="info-field compact" style="grid-column: 2;">
                <span class="info-label">التاريخ /</span>
                <span class="info-value">${selectedDate}</span>
            </div>
            <div class="info-field compact" style="grid-column: 3;">
                <span class="info-label">معامل القدرة /</span>
                <span class="info-value">${powerFactor || '-'}</span>
            </div>
            <div class="info-field" style="grid-column: 1;">
                <span class="info-label">مكان التركيب /</span>
                <span class="info-value">${location}</span>
            </div>
            <div class="info-field compact" style="grid-column: 2 / 4;">
                <span class="info-label">أقصى حمل /</span>
                <span class="info-value">${maxLoad || '-'}</span>
            </div>
        `;

            let html = `
            <div class="form-header">
                <div class="header-right-title">
                    وزارة الكهرباء والطاقة المتجددة<br>
                    الشركة القابضة لكهرباء مصر<br>
                    شركة شمال الدلتا لتوزيع الكهرباء
                </div>
                <img src="logo.jpg" alt="Logo" class="header-logo-img" />
                <div class="header-left-logo">
                    Ministry of Electricity & Renewable Energy<br>
                    Egyptian Electricity Holding Company<br>
                    North Delta Electricity Distribution Co.
                </div>
            </div>

            <div class="form-main-title">${formTitle}</div>

            <div class="info-grid">
                ${infoGridHtml}
            </div>

            ${tablesHtml}

            <div class="signature-section">
                <div class="notes-inside">
                    <div class="notes-title">الملاحظات :</div>
                    ${notesHtml}
                </div>

                <div class="committee-box">
                    <p style="font-weight: bold; font-size: 12px; margin-bottom: 2px; color: #1e40af;">اللجنة :</p>
                    <div class="select-row">
                        <span class="member-number">1-</span>
                        <select id="inputlagna1" class="inline-select" onchange="checkDropdownSelection('inputlagna1')">
                            <option value="">اختر العضو الأول</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <span class="member-number">2-</span>
                        <select id="inputlagna2" class="inline-select" onchange="checkDropdownSelection('inputlagna2')">
                            <option value="">اختر العضو الثاني</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <span class="member-number">3-</span>
                        <select id="inputlagna3" class="inline-select" onchange="checkDropdownSelection('inputlagna3')">
                            <option value="">اختر العضو الثالث</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                </div>
                <div class="sig-box">
                    <p style="font-weight: bold; font-size: 13px; color: #1e40af;">المشترك</p>
                    <div class="sig-line-dotted"></div>
                </div>
                <div class="sig-box">
                    <p style="font-weight: bold; font-size: 13px; color: #1e40af;">توقيع المدير العام</p>
                    <p style="font-weight: bold; font-size: 11px; margin-top: 2px; text-align: center;">مهندس /</p>
                    <div class="sig-line-dotted"></div>
                </div>
            </div>
        `;

            document.getElementById('formContainer').innerHTML = html;
        }

        // ============ جدول العداد المركب ============
        function generateTableRows(dataList, rowCount) {
            let rowsHtml = '';
            for (let i = 0; i < rowCount; i++) {
                const item = dataList[i];
                if (item) {
                    const meterNum = item.meternumber || item.meterNumber || item.key || '';
                    const permMeter = customerMeters[meterNum] || {};

                    const kwhValue =
                        (item.new_kwh !== undefined && item.new_kwh !== null && item.new_kwh !== '')
                            ? item.new_kwh
                            : (item.kwh !== undefined && item.kwh !== '')
                                ? item.kwh
                                : (permMeter.kwh_reading || '');

                    const kvarhValue =
                        (item.new_kvarh !== undefined && item.new_kvarh !== null && item.new_kvarh !== '')
                            ? item.new_kvarh
                            : (item.kvarh !== undefined && item.kvarh !== '')
                                ? item.kvarh
                                : (permMeter.kvarh_reading || '');

                    rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${meterNum}</td>
                        <td>${permMeter.metertype || item.metertype || ''}</td>
                        <td>${kwhValue}</td>
                        <td>${kvarhValue}</td>
                        <td>${permMeter.vt_ratio || item.vt_ratio || ''}</td>
                        <td>${permMeter.ct_ratio || item.ct_ratio || ''}</td>
                        <td>${permMeter.constant || item.constant || ''}</td>
                    </tr>
                `;
                } else {
                    rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td></td><td></td><td></td><td></td>
                        <td></td><td></td><td></td>
                    </tr>
                `;
                }
            }
            return rowsHtml;
        }

        // ============ جدول العداد المرفوع ============
        function generateRemovedTableRows(dataList, rowCount) {
            let rowsHtml = '';
            for (let i = 0; i < rowCount; i++) {
                const item = dataList[i];
                if (item) {
                    const meterNum = item.meternumber || item.meterNumber || item.key || '';
                    const permMeter = customerMeters[meterNum] || {};

                    const kwhValue =
                        (item.new_kwh !== undefined && item.new_kwh !== null && item.new_kwh !== '')
                            ? item.new_kwh
                            : (item.prev_kwh !== undefined && item.prev_kwh !== '')
                                ? item.prev_kwh
                                : '';

                    const kvarhValue =
                        (item.new_kvarh !== undefined && item.new_kvarh !== null && item.new_kvarh !== '')
                            ? item.new_kvarh
                            : (item.prev_kvarh !== undefined && item.prev_kvarh !== '')
                                ? item.prev_kvarh
                                : '';

                    const archiveDate = selectedDate || item.archiveDate || '';
                    const loc = item.location || permMeter.location || '';

                    rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${meterNum}</td>
                        <td>${item.metertype || permMeter.metertype || ''}</td>
                        <td>${kwhValue}</td>
                        <td>${kvarhValue}</td>
                        <td>${item.vt_ratio || permMeter.vt_ratio || ''}</td>
                        <td>${item.ct_ratio || permMeter.ct_ratio || ''}</td>
                        <td>${item.constant || permMeter.constant || ''}</td>
                        <td>${archiveDate}</td>
                        <td>${loc}</td>
                    </tr>
                `;
                } else {
                    rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td></td><td></td><td></td><td></td>
                        <td></td><td></td><td></td><td></td><td></td>
                    </tr>
                `;
                }
            }
            return rowsHtml;
        }

        // ============ إضافة عضو لجنة ============
        window.checkDropdownSelection = function (selectId) {
            const selectElement = document.getElementById(selectId);
            if (selectElement.value === "ADD_NEW") {
                Swal.fire({
                    title: 'إضافة عضو لجنة جديد',
                    input: 'text',
                    inputPlaceholder: 'أدخل اسم عضو اللجنة هنا...',
                    showCancelButton: true,
                    confirmButtonText: 'حفظ',
                    cancelButtonText: 'إلغاء',
                    confirmButtonColor: '#1e40af',
                    cancelButtonColor: '#d33',
                    inputValidator: (value) => {
                        if (!value || value.trim() === "") return 'لا يمكن ترك الحقل فارغاً!';
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const cleanValue = result.value.trim();
                        const committeeDropdowns = ['inputlagna1', 'inputlagna2', 'inputlagna3'];
                        committeeDropdowns.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                const newOption = document.createElement("option");
                                newOption.text = cleanValue;
                                newOption.value = cleanValue;
                                el.add(newOption, el.options[el.options.length - 1]);
                            }
                        });
                        selectElement.value = cleanValue;
                    } else {
                        selectElement.value = "";
                    }
                });
            }
        };

        window.goBack = function () {
            window.location.href = 'MD_Pass.html';
        };
    </script>

</body>
