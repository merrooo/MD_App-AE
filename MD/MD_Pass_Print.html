<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محضر رفع / تركيب / مراجعة عداد ثلاثي 5 امبير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #eef2f6;
            color: #000;
            direction: rtl;
            padding: 10px 0;
        }
        .actions-toolbar {
            max-width: 350mm;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }
        .actions-toolbar .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }
        .btn-primary { background: #1e40af; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-success { background: #0b7e3d; color: #fff; }
        .btn-danger { background: #b91c1c; color: #fff; }
        .controls-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
            font-size: 12px;
        }
        .control-group select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            background-color: #f8fafc;
        }
        .page {
            width: 350mm;
            margin: 0 auto;
            background: #fff;
            padding: 6mm 10mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            position: relative;
            min-height: 297mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2px;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 4px;
        }
        .header-left-logo, .header-right-title { font-size: 10px; font-weight: bold; line-height: 1.3; }
        .header-left-logo { text-align: right; }
        .header-right-title { text-align: left; }
        .form-main-title {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            margin: 6px 0 10px 0;
            color: #1e40af;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            row-gap: 4px;
            column-gap: 20px;
            margin-bottom: 6px;
        }
        .info-field { 
            display: flex; 
            align-items: baseline; 
            padding: 2px 0;
        }
        .info-label { 
            font-weight: 700; 
            white-space: nowrap; 
            margin-left: 8px;
            font-size: 11.5px; 
            color: #555; 
            min-width: 80px;
        }
        .info-value { 
            flex: 1; 
            font-weight: 600; 
            padding-right: 4px; 
            font-size: 11.5px;
            min-width: 120px;
        }
        .info-field.compact .info-label {
            min-width: 60px;
            margin-left: 4px;
        }
        .info-field.compact .info-value {
            min-width: 70px;
        }
        .table-section-title {
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            margin: 4px 0 2px 0;
            color: #1e40af;
        }
        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
            text-align: center;
        }
        table.form-table th, table.form-table td {
            border: 1px solid #000;
            padding: 1px 2px;
            font-size: 10.5px;
            line-height: 1.1;
        }
        table.form-table th { background-color: #f8fafc; font-weight: bold; color: #333; height: 22px; }
        table.form-table td { height: 22px; }
        .signature-section {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 15px;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
        }
        .committee-box { display: flex; flex-direction: column; gap: 3px; }
        .select-row { display: flex; align-items: center; gap: 4px; }
        .member-number { font-weight: bold; font-size: 11px; min-width: 16px; color: #1e40af; }
        .inline-select {
            width: 100%;
            height: 36px;
            padding: 2px;
            border: 1px solid #ffffff;
            font-size: 10.5px;
            background: #ffffff;
            border-radius: 4px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            text-align: right;
            text-align-last: right;
        }
        .sig-box { text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .sig-line-dotted { border-bottom: 1.5px dashed #666; margin-top: 12px; width: 80%; margin-left: auto; margin-right: auto; }
        .header-logo-img { width: 60px; height: auto; display: block; }
        .btn-add-meters {
            background: #0b7e3d;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-add-meters:hover { background: #0a6a33; }
        .btn-reset-rows {
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-reset-rows:hover { background: #991b1b; }
        .meter-action-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .table-wrapper {
            position: relative;
        }
        .notes-inside {
            grid-column: 1 / -1;
            margin-bottom: 4px;
        }
        .notes-inside .notes-title {
            font-weight: 700;
            font-size: 11px;
        }
        .notes-inside .empty-line {
            height: 18px;
            width: 100%;
        }
        @media print {
            @page {
                size: A4 portrait;
                margin: 3mm 4mm;
            }
            html, body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body {
                background: white !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .actions-toolbar {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
            }
            .page {
                box-shadow: none !important;
                border: 2px solid #1e40af !important;
                margin: 0 !important;
                padding: 3mm 5mm !important;
                width: 100% !important;
                height: 100% !important;
                min-height: 100vh !important;
                max-height: 100vh !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                overflow: hidden !important;
                position: relative !important;
            }
            .header-left-logo, .header-right-title {
                font-size: 4pt !important;
                line-height: 1.2 !important;
            }
            .form-main-title {
                font-size: 6.5pt !important;
                margin: 2px 0 3px 0 !important;
            }
            .info-label, .info-value {
                font-size: 4pt !important;
            }
            .info-label {
                min-width: 40px !important;
                margin-left: 4px !important;
            }
            .info-grid {
                row-gap: 1px !important;
                margin-bottom: 2px !important;
                grid-template-columns: 2fr 1fr 1fr !important;
            }
            .table-section-title {
                font-size: 5.5pt !important;
                margin: 2px 0 1px 0 !important;
            }
            table.form-table th, table.form-table td {
                font-size: 4.5pt !important;
                height: 16px !important;
                padding: 0px 1px !important;
                line-height: 1.0 !important;
            }
            table.form-table th {
                height: 16px !important;
                padding: 0 1px !important;
            }
            .notes-inside .notes-title {
                font-size: 4pt !important;
            }
            .notes-inside .empty-line {
                height: 12px !important;
            }
            .signature-section {
                padding-top: 3px !important;
                gap: 6px !important;
            }
            .committee-box p, .sig-box p {
                font-size: 4pt !important;
            }
            .inline-select {
                border: 1px solid #ffffff !important;
                background: transparent !important;
                font-size: 4.5pt !important;
                height: auto !important;
                padding: 0px 0px !important;
            }
            .member-number {
                font-size: 4pt !important;
                min-width: 10px !important;
            }
            .select-row {
                gap: 1px !important;
            }
            .sig-line-dotted {
                margin-top: 4px !important;
                border-bottom-width: 1px !important;
            }
            .btn-add-meters, .btn-reset-rows {
                display: none !important;
            }
            .header-logo-img {
                width: 35px !important;
            }
            table.form-table {
                margin-bottom: 2px !important;
            }
            .form-header, .info-grid, .table-section-title, table.form-table {
                flex-shrink: 0 !important;
            }
            .signature-section {
                flex-shrink: 0 !important;
            }
        }
        .status-msg { text-align: center; padding: 30px; font-size: 14px; }
    </style>
</head>

<body>

<div class="actions-toolbar">
    <button class="btn btn-secondary" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع</button>
    <div class="controls-wrap">
        <div class="control-group">
            <label for="dateSelect"><i class="fas fa-calendar-alt"></i> التاريخ:</label>
            <select id="dateSelect" onchange="onDateChange(this.value)"></select>
        </div>
        <div class="control-group">
            <label for="processSelect"><i class="fas fa-tasks"></i> نوع العملية:</label>
            <select id="processSelect" onchange="onProcessTypeChange(this.value)">
                <option value="مراجعة" selected>مراجعة</option>
                <option value="رفع-تركيب">رفع - تركيب</option>
            </select>
        </div>
        <div class="control-group" id="installedMeterGroup" style="display: none;">
            <label for="installedMeterSelect">العداد المركب:</label>
            <select id="installedMeterSelect"></select>
        </div>
        <div class="control-group" id="removedMeterGroup" style="display: none;">
            <label for="removedMeterSelect">العداد المرفوع:</label>
            <div class="meter-action-wrap">
                <select id="removedMeterSelect"></select>
                <button class="btn-add-meters" onclick="applyMeterSelection()"><i class="fas fa-plus"></i> إضافة</button>
                <button class="btn-reset-rows" onclick="resetAddedRows()"><i class="fas fa-undo"></i> إعادة</button>
            </div>
        </div>
    </div>
    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> طباعة / PDF</button>
</div>

<div class="page" id="formContainer">
    <div class="status-msg" id="loadingState"><i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
        authDomain: "production1-ae85.firebaseapp.com",
        projectId: "production1-ae85",
        storageBucket: "production1-ae85.firebasestorage.app",
        messagingSenderId: "490438031865",
        appId: "1:490438031865:web:a4a69335989f30cd13a528",
        measurementId: "G-W3TZ1EKWWN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const customerId = urlParams.get('customerId');

    let allVisits = {};
    let customerMeters = {};
    let allMetersData = {};
    let selectedDate = '';
    
    let addedInstalledRows = [];
    let addedRemovedRows = [];

    if (!customerId) {
        document.getElementById('formContainer').innerHTML = `
            <div class="status-msg" style="color: red;"><i class="fas fa-exclamation-triangle"></i> لم يتم تحديد المشترك</div>
        `;
    } else {
        fetchCustomerData();
    }

    function toYYYYMMDD(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function toDDMMYYYY(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function compareDates(date1, date2) {
        if (!date1 || !date2) return 0;
        if (date1 === date2) return 0;
        return date1 < date2 ? -1 : 1;
    }

    function getTodayDDMMYYYY() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        return `${d}-${m}-${y}`;
    }

    function getMeterLocation(customerId, meterNumber) {
        if (allMetersData[customerId] && allMetersData[customerId][meterNumber]) {
            return allMetersData[customerId][meterNumber].location || '';
        }
        return '';
    }

    async function loadAllMetersData() {
        try {
            const metersSnap = await get(ref(db, 'MD/customers'));
            if (metersSnap.exists()) {
                const customersData = metersSnap.val();
                for (let custId in customersData) {
                    if (customersData[custId] && customersData[custId].meters) {
                        allMetersData[custId] = customersData[custId].meters;
                    }
                }
                console.log('📦 All meters data loaded:', Object.keys(allMetersData).length, 'customers');
            }
        } catch (err) {
            console.warn('⚠️ Could not load meters data:', err);
        }
    }

    async function fetchCustomerData() {
        try {
            console.log('🔍 Fetching data for customer:', customerId);
            
            await loadAllMetersData();
            
            const customerSnap = await get(ref(db, `MD/customers/${customerId}`));
            let customerData = {};
            if (customerSnap.exists()) {
                customerData = customerSnap.val();
                console.log('📦 Customer data loaded:', customerData);
            }

            const passCustomerSnap = await get(ref(db, `MD_Pass/customers/${customerId}`));
            if (passCustomerSnap.exists()) {
                const data = passCustomerSnap.val();
                console.log('📦 Raw MD_Pass/customers data:', data);
                
                for (let key in data) {
                    if (/^\d{2}-\d{2}-\d{4}$/.test(key) && typeof data[key] === 'object') {
                        const visitLocation = data[key].location || customerData.location || '';
                        const visitActivity = data[key].activity || customerData.activity || '';
                        
                        allVisits[key] = { 
                            ...data[key],
                            location: visitLocation,
                            activity: visitActivity,
                            general_notes: data[key].general_notes || data[key].notes || ''
                        };
                        console.log(`✅ Loaded visit ${key}:`, allVisits[key]);
                    }
                }
            }

            if (Object.keys(allVisits).length === 0) {
                const altSnap = await get(ref(db, `MD_Pass/${customerId}`));
                if (altSnap.exists()) {
                    const data = altSnap.val();
                    console.log('📦 Raw MD_Pass data:', data);
                    
                    for (let key in data) {
                        if (/^\d{2}-\d{2}-\d{4}$/.test(key) && typeof data[key] === 'object') {
                            const visitLocation = data[key].location || customerData.location || '';
                            const visitActivity = data[key].activity || customerData.activity || '';
                            
                            allVisits[key] = { 
                                ...data[key],
                                location: visitLocation,
                                activity: visitActivity,
                                general_notes: data[key].general_notes || data[key].notes || ''
                            };
                            console.log(`✅ Loaded visit ${key}:`, allVisits[key]);
                        }
                    }
                }
            }

            if (Object.keys(allVisits).length === 0 && customerData) {
                const today = getTodayDDMMYYYY();
                allVisits[today] = { 
                    metername: customerData.metername || customerId,
                    keta3: customerData.keta3 || '',
                    handsa: customerData.handsa || '',
                    power_factor: customerData.power_factor || '',
                    max_load: customerData.max_load || '',
                    location: customerData.location || '',
                    activity: customerData.activity || '',
                    general_notes: '',
                    readings: customerData.meters || {}
                };
                console.log('📦 Created fallback visit from MD/customers');
            }

            const metersSnap = await get(ref(db, `MD/customers/${customerId}/meters`));
            if (metersSnap.exists()) {
                const metersData = metersSnap.val();
                for (let meterKey in metersData) {
                    const meter = metersData[meterKey];
                    const meterNum = meter.meternumber || meterKey;
                    customerMeters[meterNum] = { ...meter, _key: meterKey };
                }
                console.log('📦 Customer meters loaded:', Object.keys(customerMeters).length);
            }

            if (Object.keys(allVisits).length === 0) {
                document.getElementById('formContainer').innerHTML = `
                    <div class="status-msg">لا توجد زيارات مسجلة لهذا المشترك</div>
                `;
                return;
            }

            const dates = Object.keys(allVisits).sort((a, b) => {
                const aDate = toYYYYMMDD(a);
                const bDate = toYYYYMMDD(b);
                if (!aDate || !bDate) return 0;
                return compareDates(bDate, aDate);
            });
            
            selectedDate = dates[0] || getTodayDDMMYYYY();
            const dateSelect = document.getElementById('dateSelect');
            dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');

            onDateChange(selectedDate);

        } catch (error) {
            console.error('❌ Error fetching data:', error);
            document.getElementById('formContainer').innerHTML = `
                <div class="status-msg" style="color:red;">حدث خطأ أثناء تحميل البيانات: ${error.message}</div>
            `;
        }
    }

    window.onDateChange = function (dateKey) {
        selectedDate = dateKey;
        addedInstalledRows = [];
        addedRemovedRows = [];
        populateMeterSelectors();
        renderCurrentState();
    };

    function populateMeterSelectors() {
        const visit = allVisits[selectedDate] || {};
        const readings = visit.readings || {};
        const keys = Object.keys(readings);

        const addedInstalledKeys = addedInstalledRows.map(r => r.key);
        const addedRemovedKeys = addedRemovedRows.map(r => r.key);
        const availableKeys = keys.filter(k => 
            !addedInstalledKeys.includes(k) && !addedRemovedKeys.includes(k)
        );

        const options = availableKeys.map(k => {
            const num = readings[k].meternumber || k;
            return `<option value="${k}">${num}</option>`;
        }).join('');

        const installedSelect = document.getElementById('installedMeterSelect');
        const removedSelect = document.getElementById('removedMeterSelect');

        installedSelect.innerHTML = options || `<option value="">لا توجد عدادات متاحة</option>`;
        removedSelect.innerHTML = options || `<option value="">لا توجد عدادات متاحة</option>`;

        if (availableKeys.length > 0) {
            installedSelect.value = availableKeys[0];
            removedSelect.value = availableKeys[0];
        }
    }

    window.onProcessTypeChange = function (processType) {
        const isSwap = (processType === 'رفع-تركيب');
        document.getElementById('installedMeterGroup').style.display = isSwap ? 'flex' : 'none';
        document.getElementById('removedMeterGroup').style.display = isSwap ? 'flex' : 'none';
        if (!isSwap) {
            addedInstalledRows = [];
            addedRemovedRows = [];
        }
        renderCurrentState();
    };

    window.applyMeterSelection = function() {
        const processType = document.getElementById('processSelect').value;
        if (processType !== 'رفع-تركيب') {
            Swal.fire('تنبيه', 'هذه الميزة متاحة فقط في وضع "رفع - تركيب"', 'info');
            return;
        }

        const visit = allVisits[selectedDate] || {};
        const readings = visit.readings || {};
        
        const installedKey = document.getElementById('installedMeterSelect').value;
        const removedKey = document.getElementById('removedMeterSelect').value;

        const allAddedKeys = [...addedInstalledRows.map(r => r.key), ...addedRemovedRows.map(r => r.key)];
        
        if (installedKey && !allAddedKeys.includes(installedKey) && readings[installedKey]) {
            addedInstalledRows.push({ key: installedKey, ...readings[installedKey] });
        } else if (installedKey && allAddedKeys.includes(installedKey)) {
            Swal.fire('تنبيه', 'العداد المحدد مضاف بالفعل', 'warning');
            return;
        }

        if (removedKey && !allAddedKeys.includes(removedKey) && readings[removedKey]) {
            addedRemovedRows.push({ key: removedKey, ...readings[removedKey] });
        } else if (removedKey && allAddedKeys.includes(removedKey)) {
            Swal.fire('تنبيه', 'العداد المحدد مضاف بالفعل', 'warning');
            return;
        }

        populateMeterSelectors();
        renderCurrentState();
    };

    window.resetAddedRows = function() {
        addedInstalledRows = [];
        addedRemovedRows = [];
        populateMeterSelectors();
        renderCurrentState();
    };

    window.renderCurrentState = function () {
        const visit = allVisits[selectedDate] || {};
        const readings = visit.readings || {};
        const readingKeys = Object.keys(readings);
        const processType = document.getElementById('processSelect').value;

        let installedReadings = [];
        let removedReadings = [];

        if (processType === 'رفع-تركيب') {
            installedReadings = addedInstalledRows.map(r => ({ ...r }));
            removedReadings = addedRemovedRows.map(r => ({ ...r }));
        } else {
            installedReadings = readingKeys.map(k => {
                const item = readings[k];
                const meterNum = item.meternumber || k;
                const location = getMeterLocation(customerId, meterNum);
                return { key: k, ...item, location: location || item.location || '' };
            });
        }

        renderFormContent(visit, installedReadings, removedReadings, processType);
    };

    function renderFormContent(visit, installedReadings, removedReadings, processType) {
        const meterName = visit.metername || customerId;
        const maxLoad = visit.max_load || '';
        const powerFactor = visit.power_factor || '';
        
        let location = visit.location || '';
        if (!location) {
            if (installedReadings.length > 0) {
                const firstReading = installedReadings[0];
                const meterNum = firstReading.meternumber || firstReading.key;
                location = getMeterLocation(customerId, meterNum);
            }
        }
        
        const activity = visit.activity || visit.activity_type || '';

        let notes = '';
        const readingNotes = installedReadings.map(r => r.note || r.notes || '').filter(n => n);
        if (readingNotes.length > 0) {
            notes = readingNotes.join(' | ');
        }
        if (!notes) {
            notes = visit.general_notes || visit.notes || visit.meternotes || '';
        }

        const formTitle = (processType === 'رفع-تركيب')
            ? 'محضر ( رفع / تركيب ) عداد ثلاثي قدرة 5 أمبير'
            : 'محضر ( مراجعة ) عداد ثلاثي قدرة 5 أمبير';

        const installedRowCount = Math.max(3, installedReadings.length);
        const removedRowCount = Math.max(3, removedReadings.length);

        const removedTableSectionHtml = (processType === 'رفع-تركيب') ? `
            <div class="table-section-title">بيانات العداد المرفوع</div>
            <table class="form-table">
                <thead>
                    <tr>
                        <th style="width: 4%;">م</th>
                        <th style="width: 15%;">رقم الشاسية</th>
                        <th style="width: 13%;">نوع العداد</th>
                        <th style="width: 13%;">القراءة ك.وات.س</th>
                        <th style="width: 13%;">القراءة ك.فار.س</th>
                        <th style="width: 11%;">محولات الجهد</th>
                        <th style="width: 11%;">محولات التيار</th>
                        <th style="width: 8%;">الثابت</th>
                        <th style="width: 12%;">مكان التركيب</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateRemovedTableRows(removedReadings, removedRowCount)}
                </tbody>
            </table>
        ` : '';

        let infoGridHtml = `
            <!-- Row 1 -->
            <div class="info-field" style="grid-column: 1;">
                <span class="info-label">اسم المشترك /</span>
                <span class="info-value" style="min-width: 180px;">${meterName}</span>
            </div>
            <div class="info-field compact" style="grid-column: 2;">
                <span class="info-label">التاريخ /</span>
                <span class="info-value">${selectedDate}</span>
            </div>
            <div class="info-field compact" style="grid-column: 3;">
                <span class="info-label">معامل القدرة /</span>
                <span class="info-value">${powerFactor || '-'}</span>
            </div>
            
            <!-- Row 2 -->
            <div class="info-field" style="grid-column: 1;">
                <span class="info-label">النشاط /</span>
                <span class="info-value" style="min-width: 180px;">${activity}</span>
            </div>
            <div class="info-field compact" style="grid-column: 2;">
                <span class="info-label">مكان التركيب /</span>
                <span class="info-value">${location}</span>
            </div>
            <div class="info-field compact" style="grid-column: 3;">
                <span class="info-label">أقصى حمل /</span>
                <span class="info-value">${maxLoad || '-'}</span>
            </div>
        `;

        let html = `
            <div class="form-header">
                <div class="header-right-title">
                    وزارة الكهرباء والطاقة المتجددة<br>
                    الشركة القابضة لكهرباء مصر<br>
                    شركة شمال الدلتا لتوزيع الكهرباء
                </div>
                <img src="logo.jpg" alt="Logo" class="header-logo-img" />
                <div class="header-left-logo">
                    Ministry of Electricity & Renewable Energy<br>
                    Egyptian Electricity Holding Company<br>
                    North Delta Electricity Distribution Co.
                </div>
            </div>

            <div class="form-main-title">${formTitle}</div>

            <div class="info-grid">
                ${infoGridHtml}
            </div>

            <div class="table-section-title">بيانات العداد المركب</div>
            <table class="form-table">
                <thead>
                    <tr>
                        <th style="width: 4%;">م</th>
                        <th style="width: 15%;">رقم الشاسية</th>
                        <th style="width: 13%;">نوع العداد</th>
                        <th style="width: 13%;">القراءة ك.وات.س</th>
                        <th style="width: 13%;">القراءة ك.فار.س</th>
                        <th style="width: 11%;">محولات الجهد</th>
                        <th style="width: 11%;">محولات التيار</th>
                        <th style="width: 8%;">الثابت</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateTableRows(installedReadings, installedRowCount)}
                </tbody>
            </table>

            ${removedTableSectionHtml}

            <div class="signature-section">
                <div class="notes-inside">
                    <div class="notes-title">الملاحظات : ${notes}</div>
                    <div class="empty-line"></div>
                    <div class="empty-line"></div>
                </div>

                <div class="committee-box">
                    <p style="font-weight: bold; font-size: 12px; margin-bottom: 2px; color: #1e40af;">اللجنة :</p>
                    <div class="select-row">
                        <span class="member-number">1-</span>
                        <select id="inputlagna1" class="inline-select" onchange="checkDropdownSelection('inputlagna1')">
                            <option value="">اختر العضو الأول</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <span class="member-number">2-</span>
                        <select id="inputlagna2" class="inline-select" onchange="checkDropdownSelection('inputlagna2')">
                            <option value="">اختر العضو الثاني</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                    <div class="select-row">
                        <span class="member-number">3-</span>
                        <select id="inputlagna3" class="inline-select" onchange="checkDropdownSelection('inputlagna3')">
                            <option value="">اختر العضو الثالث</option>
                            <option>م/ مروة ابراهيم شهاب</option>
                            <option>م/ احمد رمضان</option>
                            <option>م/ كريم كبشة</option>
                            <option>....................................</option>
                            <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                        </select>
                    </div>
                </div>
                <div class="sig-box">
                    <p style="font-weight: bold; font-size: 13px; color: #1e40af;">المشترك</p>
                    <div class="sig-line-dotted"></div>
                </div>
                <div class="sig-box">
                    <p style="font-weight: bold; font-size: 13px; color: #1e40af;">توقيع المدير العام</p>
                    <p style="font-weight: bold; font-size: 11px; margin-top: 2px; text-align: center;">مهندس /</p>
                    <div class="sig-line-dotted"></div>
                </div>
            </div>
        `;

        document.getElementById('formContainer').innerHTML = html;
    }

    function generateTableRows(dataList, rowCount) {
        let rowsHtml = '';
        for (let i = 0; i < rowCount; i++) {
            const item = dataList[i];
            if (item) {
                const meterNum = item.meternumber || item.key || '';
                const permMeter = customerMeters[meterNum] || customerMeters[item.key] || {};
                const location = getMeterLocation(customerId, meterNum) || permMeter.location || item.location || '';
                
                rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${meterNum}</td>
                        <td>${permMeter.metertype || item.metertype || ''}</td>
                        <td>${item.kwh || ''}</td>
                        <td>${item.kvarh || ''}</td>
                        <td>${permMeter.vt_ratio || item.vt_ratio || ''}</td>
                        <td>${permMeter.ct_ratio || item.ct_ratio || ''}</td>
                        <td>${permMeter.constant || item.constant || ''}</td>
                    </tr>
                `;
            } else {
                rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td></td><td></td><td></td><td></td>
                        <td></td><td></td><td></td>
                    </tr>
                `;
            }
        }
        return rowsHtml;
    }

    function generateRemovedTableRows(dataList, rowCount) {
        let rowsHtml = '';
        for (let i = 0; i < rowCount; i++) {
            const item = dataList[i];
            if (item) {
                const meterNum = item.meternumber || item.key || '';
                const permMeter = customerMeters[meterNum] || customerMeters[item.key] || {};
                const location = getMeterLocation(customerId, meterNum) || permMeter.location || item.location || '';
                
                rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${meterNum}</td>
                        <td>${permMeter.metertype || item.metertype || ''}</td>
                        <td>${item.kwh || ''}</td>
                        <td>${item.kvarh || ''}</td>
                        <td>${permMeter.vt_ratio || item.vt_ratio || ''}</td>
                        <td>${permMeter.ct_ratio || item.ct_ratio || ''}</td>
                        <td>${permMeter.constant || item.constant || ''}</td>
                        <td>${location}</td>
                    </tr>
                `;
            } else {
                rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td></td><td></td><td></td><td></td>
                        <td></td><td></td><td></td><td></td>
                    </tr>
                `;
            }
        }
        return rowsHtml;
    }

    window.checkDropdownSelection = function (selectId) {
        const selectElement = document.getElementById(selectId);
        if (selectElement.value === "ADD_NEW") {
            Swal.fire({
                title: 'إضافة عضو لجنة جديد',
                input: 'text',
                inputPlaceholder: 'أدخل اسم عضو اللجنة هنا...',
                showCancelButton: true,
                confirmButtonText: 'حفظ',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#1e40af',
                cancelButtonColor: '#d33',
                inputValidator: (value) => {
                    if (!value || value.trim() === "") return 'لا يمكن ترك الحقل فارغاً!';
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const cleanValue = result.value.trim();
                    const committeeDropdowns = ['inputlagna1', 'inputlagna2', 'inputlagna3'];
                    committeeDropdowns.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            const newOption = document.createElement("option");
                            newOption.text = cleanValue;
                            newOption.value = cleanValue;
                            el.add(newOption, el.options[el.options.length - 1]);
                        }
                    });
                    selectElement.value = cleanValue;
                } else {
                    selectElement.value = "";
                }
            });
        }
    };

    window.goBack = function () {
        window.location.href = 'MD_Pass.html';
    };
</script>
