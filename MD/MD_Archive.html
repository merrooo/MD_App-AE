<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>الأرشيف الشامل لكبار المشتركين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #f1f5f9;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --archive: #7c3aed;
            --archive-soft: #f3e8ff;
            --text: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .brand i {
            color: var(--archive);
            font-size: 1.4rem;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu-btn {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-excel {
            background: #217346;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-excel:hover {
            background: #1a5c38;
        }

        /* ===== FILTERS ===== */
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: flex-end;
        }

        .form-group-m {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .form-label-m {
            font-size: 0.72rem;
            color: var(--text);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-label-m i {
            color: var(--primary);
            font-size: 0.8rem;
        }

        .form-input-m {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 0 10px;
            height: 38px;
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            width: 100%;
            outline: none;
            transition: all 0.2s;
        }

        select.form-input-m {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2364748b' height='18' viewBox='0 0 24 24' width='18' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 8px center;
            padding-left: 28px;
        }

        .form-input-m:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-search {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            height: 38px;
            padding: 0 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-search:hover {
            background: #1d4ed8;
        }

        .btn-clear {
            background: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            height: 38px;
            padding: 0 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        /* ===== SUMMARY BAR ===== */
        .summary-bar {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 12px 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .summary-bar .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-bar .summary-item i {
            font-size: 0.9rem;
        }

        .summary-bar .summary-item.customers i { color: var(--primary); }
        .summary-bar .summary-item.meters i { color: var(--success); }
        .summary-bar .summary-item.visits i { color: var(--warning); }
        .summary-bar .summary-item.archives i { color: var(--archive); }

        /* ===== CUSTOMER CARDS ===== */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .customer-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .customer-card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .customer-card-header .name {
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .customer-card-header .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 700;
        }

        .customer-info-row {
            padding: 12px 20px;
            background: var(--surface-card);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px 16px;
            font-size: 0.78rem;
            border-bottom: 1px solid var(--border);
        }

        .customer-info-row .info-item {
            color: var(--text-muted);
        }

        .customer-info-row .info-item b {
            color: var(--text);
            font-weight: 700;
        }

        .section-block {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }

        .section-block:last-child {
            border-bottom: none;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
        }

        .section-head .title {
            font-size: 0.9rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-head .title .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #fff;
        }

        .section-head .title.meters .icon { background: var(--success); }
        .section-head .title.visits .icon { background: var(--warning); }
        .section-head .title.archives .icon { background: var(--archive); }

        .section-head .count-badge {
            background: var(--surface-card);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 6px;
        }

        .section-head .toggle-icon {
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .section-block.collapsed .section-body {
            display: none;
        }

        .section-block.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        /* Meters table */
        .meters-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .meters-table th {
            background: var(--surface-card);
            padding: 8px 6px;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-size: 0.7rem;
        }

        .meters-table td {
            padding: 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .meters-table tr:last-child td {
            border-bottom: none;
        }

        .meters-table tr.highlight td {
            background: #fef3c7;
            font-weight: 700;
        }

        /* Visits list */
        .visits-list,
        .archives-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .visit-item {
            background: #fffbeb;
            border-right: 4px solid var(--warning);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .visit-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .visit-date {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .visit-readings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 6px;
        }

        .reading-chip {
            background: #fff;
            border: 1px solid #fde68a;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .reading-chip .mno {
            font-family: monospace;
            font-weight: 800;
            color: var(--text);
            font-size: 0.8rem;
        }

        .reading-chip .vals {
            display: flex;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .reading-chip .vals .kwh { color: var(--success); font-weight: 700; }
        .reading-chip .vals .kvarh { color: var(--accent); font-weight: 700; }

        .reading-chip.highlight {
            background: #fef3c7;
            border-color: var(--warning);
        }

        /* Archive items */
        .archive-item {
            background: var(--archive-soft);
            border-right: 4px solid var(--archive);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .archive-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .archive-date {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--archive);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .archive-meta {
            display: flex;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .archive-meta b { color: var(--text); }

        .archive-meters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .archive-meter-chip {
            background: #fff;
            border: 1px solid #ddd6fe;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
        }

        .archive-meter-chip .top-row {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .archive-meter-chip .top-row .mno { color: var(--archive); }

        .archive-meter-chip .specs {
            font-size: 0.66rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }

        /* ===== ✅ التعديل الجديد: عرض القراءات بشكل واضح ===== */
        .archive-meter-chip .readings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }

        .archive-meter-chip .reading-pair {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 0.7rem;
        }

        .archive-meter-chip .reading-pair.prev {
            border-right: 3px solid #94a3b8;
        }

        .archive-meter-chip .reading-pair.new {
            border-right: 3px solid var(--success);
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .archive-meter-chip .reading-pair .reading-label {
            font-weight: 800;
            font-size: 0.62rem;
            color: #64748b;
            margin-bottom: 3px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .archive-meter-chip .reading-pair.new .reading-label {
            color: var(--success);
        }

        .archive-meter-chip .reading-pair .reading-values {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .archive-meter-chip .reading-pair .reading-values .kv {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            padding: 1px 0;
        }

        .archive-meter-chip .reading-pair .reading-values .kv b {
            color: #475569;
            font-weight: 800;
            font-size: 0.65rem;
        }

        .archive-meter-chip .reading-pair.new .reading-values .kv b {
            color: var(--success);
        }

        .archive-meter-chip .reading-pair .reading-values .kv span {
            color: var(--text);
            font-weight: 700;
            font-family: monospace;
        }

        .archive-meter-chip.highlight {
            background: #fef3c7;
            border-color: var(--warning);
        }

        .empty-note {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-style: italic;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        /* Bottom sheet (navigation) */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1999;
            display: none;
        }

        .sheet-overlay.show { display: block; }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            z-index: 2000;
            transition: bottom 0.3s ease;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
        }

        .bottom-sheet.show { bottom: 0; }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .sheet-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sheet-item {
            padding: 10px 16px;
            background: var(--surface-card);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .sheet-item.active {
            background: var(--archive);
            color: #fff;
        }

        .item-badge {
            background: var(--archive);
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-right: auto;
        }

        @media (max-width: 640px) {
            body { padding: 8px; }
            .filters-grid { grid-template-columns: 1fr; }
            .summary-bar { flex-direction: column; align-items: stretch; }
            .summary-bar .summary-item { justify-content: center; }
            .customer-card-header { flex-direction: column; align-items: stretch; text-align: center; }
            .customer-info-row { grid-template-columns: 1fr 1fr; }
            .meters-table { font-size: 0.65rem; }
            .meters-table th, .meters-table td { padding: 4px 2px; }
            .archive-meter-chip .readings { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <i class="fas fa-box-archive"></i>
                    <span>الأرشيف الشامل لكبار المشتركين</span>
                </div>
                <div class="header-actions">
                    <button class="btn-excel" onclick="exportAllToExcel()">
                        <i class="fas fa-file-excel"></i> تصدير إكسل
                    </button>
                    <button class="nav-menu-btn" id="openMenuBtn">
                        <i class="fas fa-compass"></i> التنقل
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-grid">
                <div class="form-group-m">
                    <label class="form-label-m" for="filter_meter">
                        <i class="fas fa-microchip"></i> رقم العداد
                    </label>
                    <input type="text" id="filter_meter" class="form-input-m" placeholder="ابحث برقم العداد...">
                </div>
                <div class="form-group-m">
                    <label class="form-label-m" for="filter_name">
                        <i class="fas fa-user"></i> اسم المشترك
                    </label>
                    <input type="text" id="filter_name" class="form-input-m" placeholder="ابحث بالاسم...">
                </div>
                <div class="form-group-m">
                    <label class="form-label-m" for="date_from">
                        <i class="fas fa-calendar-alt"></i> من تاريخ
                    </label>
                    <input type="date" id="date_from" class="form-input-m">
                </div>
                <div class="form-group-m">
                    <label class="form-label-m" for="date_to">
                        <i class="fas fa-calendar-check"></i> إلى تاريخ
                    </label>
                    <input type="date" id="date_to" class="form-input-m">
                </div>
                <div class="form-group-m">
                    <label class="form-label-m" for="filter_keta3">
                        <i class="fas fa-layer-group"></i> القطاع
                    </label>
                    <select id="filter_keta3" class="form-input-m">
                        <option value="">جميع القطاعات</option>
                    </select>
                </div>
                <div class="form-group-m">
                    <label class="form-label-m" for="filter_handsa">
                        <i class="fas fa-draw-polygon"></i> الهندسة
                    </label>
                    <select id="filter_handsa" class="form-input-m">
                        <option value="">جميع الهندسات</option>
                    </select>
                </div>
                <div class="form-group-m">
                    <button class="btn-search" onclick="runSearch()">
                        <i class="fas fa-search"></i> بحث
                    </button>
                </div>
                <div class="form-group-m">
                    <button class="btn-clear" onclick="clearFilters()">
                        <i class="fas fa-eraser"></i> تفريغ
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== SUMMARY ===== -->
        <div class="summary-bar" id="summaryBar">
            <div class="summary-item customers">
                <i class="fas fa-users"></i> المشتركون: <span id="sumCustomers">0</span>
            </div>
            <div class="summary-item meters">
                <i class="fas fa-microchip"></i> العدادات: <span id="sumMeters">0</span>
            </div>
            <div class="summary-item visits">
                <i class="fas fa-clipboard-list"></i> الزيارات: <span id="sumVisits">0</span>
            </div>
            <div class="summary-item archives">
                <i class="fas fa-box-archive"></i> لقطات الأرشيف: <span id="sumArchives">0</span>
            </div>
        </div>

        <!-- ===== RESULTS ===== -->
        <main class="results-container" id="resultsContainer">
            <div class="empty-state">
                <i class="fas fa-box-archive"></i>
                <p>جارِ تحميل البيانات من القواعد الثلاث...</p>
            </div>
        </main>
    </div>

    <!-- Navigation -->
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-header">
            <h4 style="font-size: 0.95rem;">قائمة الصفحات</h4>
            <i class="fas fa-times" id="closeSheetBtn" style="cursor: pointer; font-size: 1.1rem;"></i>
        </div>
        <div class="sheet-menu">
            <a href="MD.html" class="sheet-item">📊 بيانات كبار المشتركين</a>
            <a href="MD_Add.html" class="sheet-item">➕ إضافة مشترك جديد</a>
            <a href="MD_Site.html" class="sheet-item">🔍 تسجيل مرور ميداني</a>
            <a href="MD_Pass.html" class="sheet-item">📅 تقرير المرور العام</a>
            <a href="MD_PF.html" class="sheet-item">⚡ تقرير معامل القدرة</a>
            <a href="MD_Archive.html" class="sheet-item active">📚 الأرشيف الشامل
                <span class="item-badge">الحالية</span>
            </a>
            <a href="index.html" class="sheet-item">🏠 الصفحة الرئيسية</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            databaseURL: "https://production1-ae85-default-rtdb.firebaseio.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ============ Global State ============
        let allMD = {};
        let allPass = {};
        let allArchive = {};
        let currentResults = [];
        let loaded = false;

        // ============ Helpers ============
        function isDateKey(key) {
            return typeof key === 'string' && /^\d{1,2}-\d{1,2}-\d{4}$/.test(key.trim());
        }

        function parseDateKey(key) {
            if (!isDateKey(key)) return null;
            const parts = key.trim().split('-');
            return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        }

        function formatDateFromInput(dateInputVal) {
            if (!dateInputVal) return null;
            const parts = dateInputVal.split('-');
            if (parts.length !== 3) return null;
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        function meterMatches(meterNum, term) {
            if (!term) return true;
            return String(meterNum || '').toLowerCase().includes(term);
        }

        // ============ Load all data ============
        async function loadAllData() {
            Swal.fire({
                title: 'جاري تحميل البيانات...',
                html: '<small>MD/customers + MD_Pass + MD_Archive</small>',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const [mdSnap, passSnap, archiveSnap] = await Promise.all([
                    get(ref(db, 'MD/customers')),
                    get(ref(db, 'MD_Pass/customers')),
                    get(ref(db, 'MD_Archive/customers'))
                ]);

                allMD = mdSnap.exists() ? mdSnap.val() : {};
                allPass = passSnap.exists() ? passSnap.val() : {};
                allArchive = archiveSnap.exists() ? archiveSnap.val() : {};

                console.log('📦 Loaded:', {
                    MD: Object.keys(allMD).length,
                    Pass: Object.keys(allPass).length,
                    Archive: Object.keys(allArchive).length
                });

                populateFilters();
                loaded = true;
                Swal.close();
                runSearch();
            } catch (err) {
                console.error('Load error:', err);
                Swal.fire('خطأ', 'فشل تحميل البيانات: ' + err.message, 'error');
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                        <p>خطأ في الاتصال بقاعدة البيانات</p>
                    </div>
                `;
            }
        }

        // ============ Filters population ============
        function populateFilters() {
            const kSet = new Set();
            const hSet = new Set();

            for (let custId in allMD) {
                const c = allMD[custId];
                if (c.keta3 && c.keta3 !== '-') kSet.add(c.keta3);
                if (c.handsa && c.handsa !== '-') hSet.add(c.handsa);
            }

            const kSel = document.getElementById('filter_keta3');
            const hSel = document.getElementById('filter_handsa');

            kSel.innerHTML = '<option value="">جميع القطاعات</option>' +
                [...kSet].sort().map(k => `<option value="${k}">${k}</option>`).join('');

            hSel.innerHTML = '<option value="">جميع الهندسات</option>' +
                [...hSet].sort().map(h => `<option value="${h}">${h}</option>`).join('');
        }

        // ============ Get customer display data ============
        function getCustomerDisplayInfo(custId) {
            const md = allMD[custId] || {};
            const pass = allPass[custId] || {};
            const archive = allArchive[custId] || {};

            let name = md.metername || md.name || '';
            let keta3 = md.keta3 || '';
            let handsa = md.handsa || '';

            if (!name) {
                for (let k in pass) {
                    if (pass[k] && typeof pass[k] === 'object' && pass[k].metername) {
                        name = pass[k].metername;
                        break;
                    }
                }
            }
            if (!keta3) {
                for (let k in pass) {
                    if (pass[k] && typeof pass[k] === 'object' && pass[k].keta3) {
                        keta3 = pass[k].keta3;
                        break;
                    }
                }
            }
            if (!handsa) {
                for (let k in pass) {
                    if (pass[k] && typeof pass[k] === 'object' && pass[k].handsa) {
                        handsa = pass[k].handsa;
                        break;
                    }
                }
            }
            if (!name) {
                for (let k in archive) {
                    if (archive[k] && typeof archive[k] === 'object' && archive[k].metername) {
                        name = archive[k].metername;
                        break;
                    }
                }
            }

            return {
                name: name || custId,
                keta3: keta3 || '-',
                handsa: handsa || '-',
                power_factor: md.power_factor || '-',
                max_load: md.max_load || '-'
            };
        }

        // ============ Search logic ============
        function runSearch() {
            if (!loaded) return;

            const meterTerm = document.getElementById('filter_meter').value.trim().toLowerCase();
            const nameTerm = document.getElementById('filter_name').value.trim().toLowerCase();
            const dateFromRaw = document.getElementById('date_from').value;
            const dateToRaw = document.getElementById('date_to').value;
            const keta3Filter = document.getElementById('filter_keta3').value;
            const handsaFilter = document.getElementById('filter_handsa').value;

            const fromObj = formatDateFromInput(dateFromRaw);
            const toObj = formatDateFromInput(dateToRaw);
            if (toObj) toObj.setHours(23, 59, 59, 999);

            const allIds = new Set([
                ...Object.keys(allMD),
                ...Object.keys(allPass),
                ...Object.keys(allArchive)
            ]);

            const results = [];

            for (let custId of allIds) {
                const md = allMD[custId] || {};
                const pass = allPass[custId] || {};
                const archive = allArchive[custId] || {};

                const info = getCustomerDisplayInfo(custId);

                if (nameTerm && !String(info.name).toLowerCase().includes(nameTerm)) continue;

                if (keta3Filter && info.keta3 !== keta3Filter) continue;
                if (handsaFilter && info.handsa !== handsaFilter) continue;

                const metersList = [];
                for (let mKey in (md.meters || {})) {
                    const m = md.meters[mKey];
                    const mNo = m.meternumber || mKey;
                    metersList.push({ ...m, _key: mKey, _mno: mNo });
                }

                const visits = [];
                for (let key in pass) {
                    if (!isDateKey(key)) continue;
                    const visitDate = parseDateKey(key);
                    if (!visitDate) continue;
                    if (fromObj && visitDate < fromObj) continue;
                    if (toObj && visitDate > toObj) continue;

                    const visitNode = pass[key];
                    if (!visitNode || typeof visitNode !== 'object') continue;

                    const readings = [];
                    if (visitNode.readings) {
                        for (let mKey in visitNode.readings) {
                            const r = visitNode.readings[mKey];
                            const mNo = r.meternumber || mKey;
                            readings.push({
                                meternumber: mNo,
                                kwh: r.kwh || 0,
                                kvarh: r.kvarh || 0,
                                note: r.note || ''
                            });
                        }
                    }

                    let visitMatchesMeter = true;
                    if (meterTerm) {
                        visitMatchesMeter = readings.some(r => meterMatches(r.meternumber, meterTerm));
                    }
                    if (!visitMatchesMeter) continue;

                    visits.push({
                        dateKey: key,
                        dateObj: visitDate,
                        readings: readings,
                        pf: visitNode.power_factor || '',
                        max_load: visitNode.max_load || ''
                    });
                }

                const archives = [];
                for (let key in archive) {
                    if (!isDateKey(key)) continue;
                    const snapDate = parseDateKey(key);
                    if (!snapDate) continue;
                    if (fromObj && snapDate < fromObj) continue;
                    if (toObj && snapDate > toObj) continue;

                    const snapNode = archive[key];
                    if (!snapNode || typeof snapNode !== 'object') continue;

                    const metersArr = [];
                    if (snapNode.meters) {
                        for (let mNo in snapNode.meters) {
                            const m = snapNode.meters[mNo];
                            metersArr.push({
                                meternumber: m.meternumber || mNo,
                                metertype: m.metertype || '',
                                location: m.location || '',
                                constant: m.constant || '',
                                vt_ratio: m.vt_ratio || '',
                                ct_ratio: m.ct_ratio || '',
                                prev_kwh: m.prev_kwh,
                                prev_kvarh: m.prev_kvarh,
                                new_kwh: m.new_kwh,
                                new_kvarh: m.new_kvarh,
                                note: m.note || ''
                            });
                        }
                    }

                    let archiveMatchesMeter = true;
                    if (meterTerm) {
                        archiveMatchesMeter = metersArr.some(m => meterMatches(m.meternumber, meterTerm));
                    }
                    if (!archiveMatchesMeter) continue;

                    archives.push({
                        dateKey: key,
                        dateObj: snapDate,
                        pf: snapNode.power_factor || '',
                        max_load: snapNode.max_load || '',
                        meters: metersArr
                    });
                }

                let filteredMeters = metersList;
                if (meterTerm) {
                    filteredMeters = metersList.filter(m => meterMatches(m._mno, meterTerm));
                }

                if (meterTerm) {
                    const hasMatch = filteredMeters.length > 0 || visits.length > 0 || archives.length > 0;
                    if (!hasMatch) continue;
                }

                if (!meterTerm && (fromObj || toObj)) {
                    if (visits.length === 0 && archives.length === 0) continue;
                }

                if (!meterTerm && !nameTerm && !fromObj && !toObj && !keta3Filter && !handsaFilter) {
                    if (filteredMeters.length === 0 && visits.length === 0 && archives.length === 0) continue;
                }

                visits.sort((a, b) => b.dateObj - a.dateObj);
                archives.sort((a, b) => b.dateObj - a.dateObj);

                results.push({
                    custId,
                    ...info,
                    meters: filteredMeters,
                    allMeters: metersList,
                    visits,
                    archives,
                    meterTerm,
                    hasDateFilter: !!(fromObj || toObj)
                });
            }

            results.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));

            currentResults = results;
            renderResults(results);
            updateSummary(results);
        }

        // ============ Render ============
        function renderResults(results) {
            const container = document.getElementById('resultsContainer');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search-minus"></i>
                        <p>لا توجد نتائج مطابقة لشروط البحث</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const c of results) {
                html += renderCustomerCard(c);
            }
            container.innerHTML = html;
        }

        function renderCustomerCard(c) {
            const meterTerm = c.meterTerm;

            const badges = `
                <span class="header-badge"><i class="fas fa-microchip"></i> ${c.meters.length} عداد</span>
                <span class="header-badge"><i class="fas fa-clipboard-list"></i> ${c.visits.length} زيارة</span>
                <span class="header-badge"><i class="fas fa-box-archive"></i> ${c.archives.length} أرشيف</span>
            `;

            // ===== Meters Section =====
            let metersHtml = '';
            if (c.meters.length === 0) {
                metersHtml = `<div class="empty-note">${meterTerm ? 'لا يوجد عداد مطابق' : 'لا توجد عدادات مسجلة'}</div>`;
            } else {
                metersHtml = `
                    <table class="meters-table">
                        <thead>
                            <tr>
                                <th>رقم العداد</th>
                                <th>النوع</th>
                                <th>kWh</th>
                                <th>kVARh</th>
                                <th>VT</th>
                                <th>CT</th>
                                <th>الثابت</th>
                                <th>المكان</th>
                                <th>الرفع</th>
                                <th>التركيب</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${c.meters.map(m => `
                                <tr class="${meterTerm && meterMatches(m._mno, meterTerm) ? 'highlight' : ''}">
                                    <td><b>${m._mno}</b></td>
                                    <td>${m.metertype || '-'}</td>
                                    <td>${m.kwh_reading ?? 0}</td>
                                    <td>${m.kvarh_reading ?? 0}</td>
                                    <td>${m.vt_ratio || '-'}</td>
                                    <td>${m.ct_ratio || '-'}</td>
                                    <td>${m.constant ?? '-'}</td>
                                    <td>${m.location || '-'}</td>
                                    <td>${m.inspection_date || '-'}</td>
                                    <td>${m.fix_date || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            // ===== Visits Section =====
            let visitsHtml = '';
            if (c.visits.length === 0) {
                visitsHtml = `<div class="empty-note">${c.hasDateFilter ? 'لا توجد زيارات في هذه الفترة' : 'لا توجد زيارات مسجلة'}</div>`;
            } else {
                visitsHtml = `<div class="visits-list">`;
                for (const v of c.visits) {
                    const readingsHtml = v.readings.length > 0
                        ? v.readings.map(r => `
                            <div class="reading-chip ${meterTerm && meterMatches(r.meternumber, meterTerm) ? 'highlight' : ''}">
                                <div class="mno">${r.meternumber}</div>
                                <div class="vals">
                                    <span>kWh: <span class="kwh">${r.kwh}</span></span>
                                    <span>kVARh: <span class="kvarh">${r.kvarh}</span></span>
                                </div>
                                ${r.note ? `<small style="color: var(--text-muted); font-size: 0.65rem;">📝 ${r.note}</small>` : ''}
                            </div>
                        `).join('')
                        : `<div class="empty-note">لا توجد قراءات مسجلة</div>`;

                    visitsHtml += `
                        <div class="visit-item">
                            <div class="visit-item-header">
                                <div class="visit-date">
                                    <i class="fas fa-calendar-check"></i> ${v.dateKey}
                                </div>
                                ${v.pf ? `<span style="font-size: 0.7rem; color: var(--text-muted);">PF: <b>${v.pf}</b></span>` : ''}
                            </div>
                            <div class="visit-readings">${readingsHtml}</div>
                        </div>
                    `;
                }
                visitsHtml += `</div>`;
            }

            // ===== Archives Section =====
            let archivesHtml = '';
            if (c.archives.length === 0) {
                archivesHtml = `<div class="empty-note">${c.hasDateFilter ? 'لا توجد لقطات أرشيف في هذه الفترة' : 'لا توجد لقطات أرشيف'}</div>`;
            } else {
                archivesHtml = `<div class="archives-list">`;
                for (const a of c.archives) {
                    const metersHtml2 = a.meters.length > 0
                        ? a.meters.map(m => {
                            // ✅ استخراج مرن للقيم (يدعم الحقول البديلة من الأرشيفات القديمة)
                            const pick = (...vals) => {
                                for (const v of vals) {
                                    if (v !== undefined && v !== null && v !== '') return v;
                                }
                                return undefined;
                            };

                            const prevKwh   = pick(m.prev_kwh,   m.prevKwh,   m.kwh_reading);
                            const prevKvarh = pick(m.prev_kvarh, m.prevKvarh, m.kvarh_reading);
                            const newKwh    = pick(m.new_kwh,    m.newKwh,    m.kwh);
                            const newKvarh  = pick(m.new_kvarh,  m.newKvarh,  m.kvarh);

                            // ✅ عرض "-" عند عدم وجود قيمة (بدلاً من "0" المضلِّل)
                            const fmt = (v) => {
                                if (v === undefined || v === null || v === '') return '-';
                                if (typeof v === 'number' && isNaN(v)) return '-';
                                return v;
                            };

                            return `
                            <div class="archive-meter-chip ${meterTerm && meterMatches(m.meternumber, meterTerm) ? 'highlight' : ''}">
                                <div class="top-row">
                                    <span class="mno">${m.meternumber || m.mKey || '-'}</span>
                                    <span style="color: var(--text-muted); font-size: 0.65rem;">${m.metertype || ''}</span>
                                </div>
                                <div class="specs">
                                    ${m.location ? `<span>📍 ${m.location}</span>` : ''}
                                    ${m.constant ? `<span>ثابت: ${m.constant}</span>` : ''}
                                    ${m.vt_ratio ? `<span>VT: ${m.vt_ratio}</span>` : ''}
                                    ${m.ct_ratio ? `<span>CT: ${m.ct_ratio}</span>` : ''}
                                </div>
                                <div class="readings">
                                    <div class="reading-pair prev">
                                        <div class="reading-label">السابقة</div>
                                        <div class="reading-values">
                                            <div class="kv"><b>kWh</b><span>${fmt(prevKwh)}</span></div>
                                            <div class="kv"><b>kVARh</b><span>${fmt(prevKvarh)}</span></div>
                                        </div>
                                    </div>
                                    <div class="reading-pair new">
                                        <div class="reading-label">الجديدة</div>
                                        <div class="reading-values">
                                            <div class="kv"><b>kWh</b><span>${fmt(newKwh)}</span></div>
                                            <div class="kv"><b>kVARh</b><span>${fmt(newKvarh)}</span></div>
                                        </div>
                                    </div>
                                </div>
                                ${m.note ? `<div style="font-size: 0.65rem; color: var(--text-muted); margin-top: 3px;">📝 ${m.note}</div>` : ''}
                            </div>
                        `;
                        }).join('')
                        : `<div class="empty-note">لا توجد عدادات في هذه اللقطة</div>`;

                    archivesHtml += `
                        <div class="archive-item">
                            <div class="archive-item-header">
                                <div class="archive-date">
                                    <i class="fas fa-box-archive"></i> ${a.dateKey}
                                </div>
                                <div class="archive-meta">
                                    ${a.pf ? `PF: <b>${a.pf}</b>` : ''}
                                    ${a.max_load ? `أقصى حمل: <b>${a.max_load}</b>` : ''}
                                </div>
                            </div>
                            <div class="archive-meters">${metersHtml2}</div>
                        </div>
                    `;
                }
                archivesHtml += `</div>`;
            }

            return `
                <div class="customer-card">
                    <div class="customer-card-header">
                        <div class="name">
                            <i class="fas fa-user-circle"></i>
                            ${c.name}
                        </div>
                        <div class="badges">${badges}</div>
                    </div>
                    <div class="customer-info-row">
                        <div class="info-item">القطاع: <b>${c.keta3}</b></div>
                        <div class="info-item">الهندسة: <b>${c.handsa}</b></div>
                        <div class="info-item">معامل القدرة: <b>${c.power_factor}</b></div>
                        <div class="info-item">أقصى حمل: <b>${c.max_load}</b></div>
                    </div>

                    <div class="section-block">
                        <div class="section-head" onclick="toggleSection(this)">
                            <div class="title meters">
                                <div class="icon"><i class="fas fa-microchip"></i></div>
                                العدادات الحالية
                                <span class="count-badge">${c.meters.length}</span>
                            </div>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </div>
                        <div class="section-body">${metersHtml}</div>
                    </div>

                    <div class="section-block">
                        <div class="section-head" onclick="toggleSection(this)">
                            <div class="title visits">
                                <div class="icon"><i class="fas fa-clipboard-list"></i></div>
                                سجل المرور (MD_Pass)
                                <span class="count-badge">${c.visits.length}</span>
                            </div>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </div>
                        <div class="section-body">${visitsHtml}</div>
                    </div>

                    <div class="section-block">
                        <div class="section-head" onclick="toggleSection(this)">
                            <div class="title archives">
                                <div class="icon"><i class="fas fa-box-archive"></i></div>
                                الأرشيف (MD_Archive)
                                <span class="count-badge">${c.archives.length}</span>
                            </div>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </div>
                        <div class="section-body">${archivesHtml}</div>
                    </div>
                </div>
            `;
        }

        function updateSummary(results) {
            let totalMeters = 0;
            let totalVisits = 0;
            let totalArchives = 0;

            for (const r of results) {
                totalMeters += r.meters.length;
                totalVisits += r.visits.length;
                totalArchives += r.archives.length;
            }

            document.getElementById('sumCustomers').textContent = results.length;
            document.getElementById('sumMeters').textContent = totalMeters;
            document.getElementById('sumVisits').textContent = totalVisits;
            document.getElementById('sumArchives').textContent = totalArchives;
        }

        // ============ UI Interactions ============
        window.toggleSection = function (headEl) {
            const block = headEl.parentElement;
            block.classList.toggle('collapsed');
        };

        window.clearFilters = function () {
            document.getElementById('filter_meter').value = '';
            document.getElementById('filter_name').value = '';
            document.getElementById('date_from').value = '';
            document.getElementById('date_to').value = '';
            document.getElementById('filter_keta3').value = '';
            document.getElementById('filter_handsa').value = '';
            runSearch();
        };

        // ============ Export to Excel ============
        window.exportAllToExcel = function () {
            if (currentResults.length === 0) {
                Swal.fire('تنبيه', 'لا توجد بيانات لتصديرها. قم ببحث أولاً.', 'info');
                return;
            }

            // Sheet 1: Current Meters
            const metersData = [];
            for (const c of currentResults) {
                for (const m of c.meters) {
                    metersData.push({
                        'اسم المشترك': c.name,
                        'القطاع': c.keta3,
                        'الهندسة': c.handsa,
                        'رقم العداد': m._mno,
                        'النوع': m.metertype || '',
                        'kWh': m.kwh_reading ?? 0,
                        'kVARh': m.kvarh_reading ?? 0,
                        'VT': m.vt_ratio || '',
                        'CT': m.ct_ratio || '',
                        'الثابت': m.constant ?? '',
                        'المكان': m.location || '',
                        'تاريخ الرفع': m.inspection_date || '',
                        'تاريخ التركيب': m.fix_date || ''
                    });
                }
            }

            // Sheet 2: Visits
            const visitsData = [];
            for (const c of currentResults) {
                for (const v of c.visits) {
                    if (v.readings.length === 0) {
                        visitsData.push({
                            'اسم المشترك': c.name,
                            'القطاع': c.keta3,
                            'الهندسة': c.handsa,
                            'التاريخ': v.dateKey,
                            'رقم العداد': '-',
                            'kWh': '-',
                            'kVARh': '-',
                            'ملاحظات': 'لا توجد قراءات'
                        });
                    } else {
                        for (const r of v.readings) {
                            visitsData.push({
                                'اسم المشترك': c.name,
                                'القطاع': c.keta3,
                                'الهندسة': c.handsa,
                                'التاريخ': v.dateKey,
                                'رقم العداد': r.meternumber,
                                'kWh': r.kwh,
                                'kVARh': r.kvarh,
                                'ملاحظات': r.note || ''
                            });
                        }
                    }
                }
            }

            // Sheet 3: Archive
            const archiveData = [];
            for (const c of currentResults) {
                for (const a of c.archives) {
                    for (const m of a.meters) {
                        archiveData.push({
                            'اسم المشترك': c.name,
                            'القطاع': c.keta3,
                            'الهندسة': c.handsa,
                            'التاريخ': a.dateKey,
                            'رقم العداد': m.meternumber,
                            'النوع': m.metertype,
                            'المكان': m.location,
                            'السابقة kWh': m.prev_kwh ?? '-',
                            'السابقة kVARh': m.prev_kvarh ?? '-',
                            'الجديدة kWh': m.new_kwh ?? '-',
                            'الجديدة kVARh': m.new_kvarh ?? '-',
                            'VT': m.vt_ratio,
                            'CT': m.ct_ratio,
                            'الثابت': m.constant,
                            'ملاحظات': m.note
                        });
                    }
                }
            }

            const wb = XLSX.utils.book_new();

            if (metersData.length > 0) {
                const ws1 = XLSX.utils.json_to_sheet(metersData);
                XLSX.utils.book_append_sheet(wb, ws1, 'العدادات الحالية');
            }
            if (visitsData.length > 0) {
                const ws2 = XLSX.utils.json_to_sheet(visitsData);
                XLSX.utils.book_append_sheet(wb, ws2, 'سجل المرور');
            }
            if (archiveData.length > 0) {
                const ws3 = XLSX.utils.json_to_sheet(archiveData);
                XLSX.utils.book_append_sheet(wb, ws3, 'الأرشيف');
            }

            if (wb.SheetNames.length === 0) {
                Swal.fire('تنبيه', 'لا توجد بيانات لتصديرها', 'info');
                return;
            }

            XLSX.writeFile(wb, `الأرشيف_الشامل_${new Date().toISOString().slice(0, 10)}.xlsx`);
            Swal.fire('تم', 'تم تصدير البيانات بنجاح', 'success');
        };

        // ============ Navigation ============
        document.getElementById('openMenuBtn').addEventListener('click', () => {
            document.getElementById('bottomSheet').classList.add('show');
            document.getElementById('sheetOverlay').classList.add('show');
        });

        document.getElementById('closeSheetBtn').addEventListener('click', () => {
            document.getElementById('bottomSheet').classList.remove('show');
            document.getElementById('sheetOverlay').classList.remove('show');
        });

        document.getElementById('sheetOverlay').addEventListener('click', () => {
            document.getElementById('bottomSheet').classList.remove('show');
            document.getElementById('sheetOverlay').classList.remove('show');
        });

        // ============ Event listeners ============
        document.getElementById('filter_meter').addEventListener('input', debounce(runSearch, 300));
        document.getElementById('filter_name').addEventListener('input', debounce(runSearch, 300));
        document.getElementById('date_from').addEventListener('change', runSearch);
        document.getElementById('date_to').addEventListener('change', runSearch);
        document.getElementById('filter_keta3').addEventListener('change', runSearch);
        document.getElementById('filter_handsa').addEventListener('change', runSearch);

        function debounce(fn, ms) {
            let t;
            return function () {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, arguments), ms);
            };
        }

        // ============ Init ============
        loadAllData();
    </script>
</body>

</html>
