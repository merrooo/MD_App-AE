<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محضر رفع / تركيب / مراجعة عداد ثلاثي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #eef2f6;
            color: #000;
            direction: rtl;
            padding: 10px 0;
        }

        /* Action Toolbar (Screen only) */
        .actions-toolbar {
            max-width: 350mm;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .actions-toolbar .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: #1e40af;
            color: #fff;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-success {
            background: #059669;
            color: #fff;
        }

        .controls-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
            font-size: 12px;
        }

        .control-group select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            background-color: #f8fafc;
        }

        /* Official Form Paper Styling */
        .page {
            width: 350mm;
            margin: 0 auto;
            background: #fff;
            padding: 6mm 10mm;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            position: relative;
            min-height: 297mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Form Header */
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2px;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 4px;
        }

        .header-left-logo,
        .header-right-title {
            font-size: 10px;
            font-weight: bold;
            line-height: 1.3;
        }

        .header-left-logo {
            text-align: right;
        }

        .header-right-title {
            text-align: left;
        }

        .form-main-title {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            margin: 6px 0 10px 0;
            color: #1e40af;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Form Metadata Fields Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 6px;
            column-gap: 20px;
            margin-bottom: 8px;
        }

        .info-field {
            display: flex;
            align-items: baseline;
        }

        .info-label {
            font-weight: 700;
            white-space: nowrap;
            margin-left: 4px;
            font-size: 11.5px;
            color: #555;
        }

        .info-value {
            flex: 1;
            border-bottom: 1px dotted #000;
            padding-bottom: 1px;
            font-weight: 600;
            padding-right: 4px;
            font-size: 11.5px;
        }

        /* Section Header Titles with Add Buttons */
        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 3px 0;
        }

        .table-section-title {
            font-weight: 700;
            font-size: 12px;
            color: #1e40af;
        }

        .btn-add-row {
            background-color: #059669;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-add-row:hover {
            background-color: #047857;
        }

        .btn-del-row {
            background: transparent;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 11px;
            padding: 0 4px;
        }

        .btn-del-row:hover {
            color: #991b1b;
        }

        /* Standard Table Styling */
        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
            text-align: center;
        }

        table.form-table th,
        table.form-table td {
            border: 1px solid #000;
            padding: 2px 2px;
            font-size: 10.5px;
            line-height: 1.15;
        }

        table.form-table th {
            background-color: #f8fafc;
            font-weight: bold;
            color: #333;
            height: 24px;
        }

        table.form-table td {
            height: 26px;
        }

        /* Interactive Inputs inside Table Cells */
        .table-input {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-size: 10.5px;
            outline: none;
            padding: 2px;
        }

        .table-input:focus {
            background: #f1f5f9;
        }

        /* Notes Lines */
        .notes-container {
            margin-top: 4px;
        }

        .notes-title {
            font-weight: 700;
            margin-bottom: 2px;
            font-size: 11px;
        }

        .dotted-line {
            border-bottom: 1px dotted #000;
            height: 22px;
            width: 100%;
        }

        /* Signatures Section */
        .signature-section {
            margin-top: auto; 
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 15px;
            padding-top: 8px;
            border-top: 1px solid #f1f5f9;
        }

        .committee-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .select-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-number {
            font-weight: bold;
            font-size: 11px;
            min-width: 16px;
            color: #1e40af;
        }

        .inline-select {
            width: 100%;
            height: 26px;
            padding: 2px;
            border: 1px solid #ffffff;
            font-size: 10.5px;
            background: #ffffff;
            border-radius: 4px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            text-align: right;
            text-align-last: right;
        }

        .sig-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sig-line-dotted {
            border-bottom: 1.5px dashed #666;
            margin-top: 15px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .header-logo-img {
            width: 60px;
            height: auto;
            display: block;
        }

        /* Print Override CSS - AUTO FIT PAGE LOCK */
        @media print {
            @page {
                size: A4 portrait;
                margin: 4mm;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                width: 100% !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .actions-toolbar, .btn-add-row, .btn-del-row {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
            }

            .page {
                box-shadow: none !important;
                border: 2px solid #1e40af !important;
                margin: 0 !important;
                width: 100% !important;
                padding: 4mm 6mm !important;
                min-height: 284mm !important;
                max-height: 284mm !important;
                overflow: hidden !important;
                zoom: 90%;
            }

            .header-left-logo, .header-right-title {
                font-size: 8.5pt !important;
            }

            .form-main-title {
                font-size: 12.5pt !important;
                margin: 4px 0 8px 0 !important;
            }

            .info-label, .info-value {
                font-size: 9.5pt !important;
            }
            
            .info-grid {
                 row-gap: 4px !important;
                 margin-bottom: 6px !important;
            }

            table.form-table th,
            table.form-table td {
                font-size: 9pt !important;
                height: 22px !important;
                padding: 1px !important;
            }

            .table-section-title {
                font-size: 10pt !important;
            }

            .table-input {
                font-size: 9pt !important;
                background: transparent !important;
            }

            .signature-section {
                 margin-top: auto !important;
                 padding-top: 6px !important;
            }

            .committee-box p, .sig-box p {
                font-size: 9.5pt !important;
            }

            .inline-select {
                border: 1px solid #ffffff !important;
                background: transparent !important;
                font-size: 9pt !important;
                height: auto !important;
                padding: 1px 0 !important;
            }
            
            .notes-title {
                 font-size: 9pt !important;
            }
            .dotted-line {
                 height: 18px !important;
            }
        }

        .status-msg {
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Actions Control Toolbar -->
    <div class="actions-toolbar">
        <button class="btn btn-secondary" onclick="goBack()">
            <i class="fas fa-arrow-right"></i> رجوع
        </button>

        <div class="controls-wrap">
            <!-- Date Selector -->
            <div class="control-group">
                <label for="dateSelect"><i class="fas fa-calendar-alt"></i> التاريخ:</label>
                <select id="dateSelect" onchange="onDateChange(this.value)">
                </select>
            </div>

            <!-- Operation Type Selector -->
            <div class="control-group">
                <label for="processSelect"><i class="fas fa-tasks"></i> نوع العملية:</label>
                <select id="processSelect" onchange="onProcessTypeChange(this.value)">
                    <option value="مراجعة" selected>مراجعة</option>
                    <option value="رفع-تركيب">رفع - تركيب</option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary" onclick="window.print()">
            <i class="fas fa-print"></i> طباعة / PDF
        </button>
    </div>

    <!-- Main Print Form Document -->
    <div class="page" id="formContainer">
        <div class="status-msg" id="loadingState">
            <i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528",
            measurementId: "G-W3TZ1EKWWN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('customerId');

        let allVisits = {};
        let customerMeters = {};
        let selectedDate = '';
        
        // Runtime editable lists for table rows
        let currentInstalledRows = [];
        let currentRemovedRows = [];

        if (!customerId) {
            document.getElementById('formContainer').innerHTML = `
                <div class="status-msg" style="color: red;">
                    <i class="fas fa-exclamation-triangle"></i> لم يتم تحديد المشترك
                </div>
            `;
        } else {
            fetchCustomerData();
        }

        async function fetchCustomerData() {
            try {
                const visitsSnap = await get(ref(db, `MD_Pass/visits/${customerId}`));
                if (visitsSnap.exists()) {
                    allVisits = visitsSnap.val();
                } else {
                    const altSnap = await get(ref(db, `MD_Pass/${customerId}`));
                    if (altSnap.exists()) {
                        const data = altSnap.val();
                        for (let key in data) {
                            if (key !== 'customers' && key !== 'meters' && !key.startsWith('_')) {
                                allVisits[key] = data[key];
                            }
                        }
                    }
                }

                const metersSnap = await get(ref(db, `MD_Pass/customers/${customerId}/meters`));
                if (metersSnap.exists()) {
                    const metersData = metersSnap.val();
                    for (let meterKey in metersData) {
                        const meter = metersData[meterKey];
                        const meterNum = meter.meternumber || meterKey;
                        customerMeters[meterNum] = { ...meter, _key: meterKey };
                    }
                }

                if (Object.keys(allVisits).length === 0) {
                    document.getElementById('formContainer').innerHTML = `
                        <div class="status-msg">لا توجد زيارات مسجلة لهذا المشترك</div>
                    `;
                    return;
                }

                const dates = Object.keys(allVisits).sort().reverse();
                selectedDate = dates[0];
                const dateSelect = document.getElementById('dateSelect');
                dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');

                onDateChange(selectedDate);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('formContainer').innerHTML = `
                    <div class="status-msg" style="color:red;">حدث خطأ أثناء تحميل البيانات: ${error.message}</div>
                `;
            }
        }

        window.onDateChange = function (dateKey) {
            selectedDate = dateKey;
            loadDefaultRowsForDate();
            renderFormLayout();
        };

        function loadDefaultRowsForDate() {
            const visit = allVisits[selectedDate] || {};
            const readings = visit.readings || {};
            const readingKeys = Object.keys(readings);
            const processType = document.getElementById('processSelect').value;

            currentInstalledRows = [];
            currentRemovedRows = [];

            if (processType === 'رفع-تركيب') {
                // Split readings or assign nicely between installed and removed
                if (readingKeys.length >= 2) {
                    currentInstalledRows.push({ key: readingKeys[0], ...readings[readingKeys[0]] });
                    currentRemovedRows.push({ key: readingKeys[1], ...readings[readingKeys[1]] });
                } else if (readingKeys.length === 1) {
                    currentInstalledRows.push({ key: readingKeys[0], ...readings[readingKeys[0]] });
                }
            } else {
                // Review mode: load all database records into installed table
                readingKeys.forEach(k => {
                    currentInstalledRows.push({ key: k, ...readings[k] });
                });
            }

            // Ensure at least a minimum row count for neatness
            if (currentInstalledRows.length === 0) {
                currentInstalledRows.push({});
            }
            if (processType === 'رفع-تركيب' && currentRemovedRows.length === 0) {
                currentRemovedRows.push({});
            }
        }

        window.onProcessTypeChange = function (processType) {
            loadDefaultRowsForDate();
            renderFormLayout();
        };

        // Add custom empty row to Installed Table
        window.addInstalledRow = function() {
            currentInstalledRows.push({});
            renderFormLayout();
        };

        // Add custom empty row to Removed Table
        window.addRemovedRow = function() {
            currentRemovedRows.push({});
            renderFormLayout();
        };

        window.removeInstalledRow = function(index) {
            currentInstalledRows.splice(index, 1);
            if (currentInstalledRows.length === 0) currentInstalledRows.push({});
            renderFormLayout();
        };

        window.removeRemovedRow = function(index) {
            currentRemovedRows.splice(index, 1);
            if (currentRemovedRows.length === 0) currentRemovedRows.push({});
            renderFormLayout();
        };

        window.renderFormLayout = function () {
            const visit = allVisits[selectedDate] || {};
            const processType = document.getElementById('processSelect').value;

            const meterName = visit.metername || customerId;
            const maxLoad = visit.max_load || '';
            const powerFactor = visit.power_factor || '';
            const location = visit.location || '';
            const activity = visit.activity || visit.activity_type || '';

            const formTitle = (processType === 'رفع-تركيب')
                ? 'محضر ( رفع / تركيب ) عداد ثلاثي قدرة 5 أمبير'
                : 'محضر ( مراجعة ) عداد ثلاثي قدرة 5 أمبير';

            const locationFieldHtml = (processType === 'مراجعة') ? `
                <div class="info-field">
                    <span class="info-label">مكان التركيب /</span>
                    <span class="info-value">${location}</span>
                </div>
            ` : '';

            const removedTableSectionHtml = (processType === 'رفع-تركيب') ? `
                <div class="section-header-row">
                    <div class="table-section-title">بيانات العداد المرفوع</div>
                    <button type="button" class="btn-add-row" onclick="addRemovedRow()"><i class="fas fa-plus"></i> إضافة عداد مرفوع</button>
                </div>
                <table class="form-table">
                    <thead>
                        <tr>
                            <th style="width: 4%;">م</th>
                            <th style="width: 14%;">رقم الشاسية</th>
                            <th style="width: 12%;">نوع العداد</th>
                            <th style="width: 12%;">القراءة ك.وات.س</th>
                            <th style="width: 12%;">القراءة ك.فار.س</th>
                            <th style="width: 10%;">محولات الجهد</th>
                            <th style="width: 10%;">محولات التيار</th>
                            <th style="width: 8%;">الثابت</th>
                            <th style="width: 14%;">مكان التركيب</th>
                            <th style="width: 4%;" class="no-print">حذف</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${generateRemovedTableRows(currentRemovedRows)}
                    </tbody>
                </table>
            ` : '';

            let html = `
                <div class="form-header">
                    <div class="header-right-title">
                        وزارة الكهرباء والطاقة المتجددة<br>
                        الشركة القابضة لكهرباء مصر<br>
                        شركة شمال الدلتا لتوزيع الكهرباء
                    </div>
                    
                    <img src="logo.jpg" alt="Logo" class="header-logo-img" />

                    <div class="header-left-logo">
                        Ministry of Electricity & Renewable Energy<br>
                        Egyptian Electricity Holding Company<br>
                        North Delta Electricity Distribution Co.
                    </div>
                </div>

                <div class="form-main-title">
                    ${formTitle}
                </div>

                <div class="info-grid">
                    <div class="info-field">
                        <span class="info-label">اسم المشترك /</span>
                        <span class="info-value">${meterName}</span>
                    </div>
                    <div class="info-field">
                        <span class="info-label">التاريخ /</span>
                        <span class="info-value">${selectedDate}</span>
                    </div>

                    ${locationFieldHtml}
                    
                    <div class="info-field">
                        <span class="info-label">النشاط /</span>
                        <span class="info-value">${activity}</span>
                    </div>
                </div>

                <div class="section-header-row">
                    <div class="table-section-title">بيانات العداد المركب</div>
                    <button type="button" class="btn-add-row" onclick="addInstalledRow()"><i class="fas fa-plus"></i> إضافة عداد مركب</button>
                </div>
                <table class="form-table">
                    <thead>
                        <tr>
                            <th style="width: 4%;">م</th>
                            <th style="width: 13%;">رقم الشاسية</th>
                            <th style="width: 11%;">نوع العداد</th>
                            <th style="width: 11%;">القراءة ك.وات.س</th>
                            <th style="width: 11%;">القراءة ك.فار.س</th>
                            <th style="width: 9%;">محولات الجهد</th>
                            <th style="width: 9%;">محولات التيار</th>
                            <th style="width: 8%;">الثابت</th>
                            <th style="width: 10%;">معامل القدرة</th>
                            <th style="width: 10%;">أقصى حمل</th>
                            <th style="width: 4%;" class="no-print">حذف</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${generateInstalledTableRows(currentInstalledRows, maxLoad, powerFactor)}
                    </tbody>
                </table>

                ${removedTableSectionHtml}

                <div class="notes-container">
                    <div class="notes-title">الملاحظات : ${visit.notes || visit.general_notes || ''}</div>
                    <div class="dotted-line"></div>
                    <div class="dotted-line"></div>
                </div>

                <div class="signature-section">
                    <div class="committee-box">
                        <p style="font-weight: bold; font-size: 12px; margin-bottom: 2px; color: #1e40af;">اللجنة :</p>

                        <div class="select-row">
                            <span class="member-number">1-</span>
                            <select id="inputlagna1" class="inline-select" onchange="checkDropdownSelection('inputlagna1')">
                                <option value="">اختر العضو الأول</option>
                                <option>م/ مروة ابراهيم شهاب</option>
                                <option>م/ احمد رمضان</option>
                                <option>م/ كريم كبشة</option>
                                <option>.................................................</option>
                                <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                            </select>
                        </div>

                        <div class="select-row">
                            <span class="member-number">2-</span>
                            <select id="inputlagna2" class="inline-select" onchange="checkDropdownSelection('inputlagna2')">
                                <option value="">اختر العضو الثاني</option>
                                <option>م/ مروة ابراهيم شهاب</option>
                                <option>م/ احمد رمضان</option>
                                <option>م/ كريم كبشة</option>
                                <option>.................................................</option>
                                <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                            </select>
                        </div>

                        <div class="select-row">
                            <span class="member-number">3-</span>
                            <select id="inputlagna3" class="inline-select" onchange="checkDropdownSelection('inputlagna3')">
                                <option value="">اختر العضو الثالث</option>
                                <option>م/ مروة ابراهيم شهاب</option>
                                <option>م/ احمد رمضان</option>
                                <option>م/ كريم كبشة</option>
                                <option>.................................................</option>
                                <option value="ADD_NEW" style="color: #27ae60; font-weight: bold;">[ ➕ إضافة عضو جديد... ]</option>
                            </select>
                        </div>
                    </div>

                    <div class="sig-box">

        function generateInstalledTableRows(dataList, defaultMaxLoad, defaultPf) {
            let rowsHtml = '';
            dataList.forEach((item, i) => {
                const meterNum = item.meternumber || item.key || '';
                const permMeter = customerMeters[meterNum] || customerMeters[item.key] || {};
                
                const mType = permMeter.metertype || item.metertype || '';
                const kWh = item.kwh || '';
                const kVArh = item.kvarh || '';
                const vt = permMeter.vt_ratio || item.vt_ratio || '';
                const ct = permMeter.ct_ratio || item.ct_ratio || '';
                const constant = permMeter.constant || item.constant || '';
                const pf = item.power_factor || defaultPf || '';
                const maxL = item.max_load || defaultMaxLoad || '';

                rowsHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td><input type="text" class="table-input" value="${meterNum}" /></td>
                        <td><input type="text" class="table-input" value="${mType}" /></td>
                        <td><input type="text" class="table-input" value="${kWh}" /></td>
                        <td><input type="text" class="table-input" value="${kVArh}" /></td>
                        <td><input type="text" class="table-input" value="${vt}" /></td>
                        <td><input type="text" class="table-input" value="${ct}" /></td>
                        <td><input type="text" class="table-input" value="${constant}" /></td>
                        <td><input type="text" class="table-input" value="${pf}" /></td>
                        <td><input type="text" class="table-input" value="${maxL}" /></td>
                        <td class="no-print"><button type="button" class="btn-del-row" onclick="removeInstalledRow(${i})"><i class="fas fa-times"></i></button></td>
                    </tr>
                `;
            });
            return rowsHtml;
        }

        window.checkDropdownSelection = function (selectId) {
            const selectElement = document.getElementById(selectId);

            if (selectElement.value === "ADD_NEW") {
                Swal.fire({
                    title: 'إضافة عضو لجنة جديد',
                    input: 'text',
                    inputPlaceholder: 'أدخل اسم عضو اللجنة هنا...',
                    showCancelButton: true,
                    confirmButtonText: 'حفظ',
                    cancelButtonText: 'إلغاء',
                    confirmButtonColor: '#1e40af',
                    cancelButtonColor: '#d33',
                    inputValidator: (value) => {
                        if (!value || value.trim() === "") {
                            return 'لا يمكن ترك الحقل فارغاً!';
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const cleanValue = result.value.trim();
                        const committeeDropdowns = ['inputlagna1', 'inputlagna2', 'inputlagna3'];

                        committeeDropdowns.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                const newOption = document.createElement("option");
                                newOption.text = cleanValue;
                                newOption.value = cleanValue;
                                el.add(newOption, el.options[el.options.length - 1]);
                            }
                        });

                        selectElement.value = cleanValue;
                    } else {
                        selectElement.value = "";
                    }
                });
            }
        };

        window.goBack = function () {
            window.location.href = 'MD_Pass_Dashboard.html';
        };
